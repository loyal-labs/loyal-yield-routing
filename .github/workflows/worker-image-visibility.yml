name: worker-image-visibility

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - loyal-yield-routing/laserstream-workers
          - loyal-yield-routing/light-workers
    steps:
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: loyal-labs
          PACKAGE: ${{ matrix.package }}
        run: |
          encoded_package="${PACKAGE//\//%2F}"
          gh api \
            --method PATCH \
            "/orgs/${ORG}/packages/container/${encoded_package}/visibility" \
            -f visibility=public
