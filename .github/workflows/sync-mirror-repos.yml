name: Sync Mirror Repos

on:
  pull_request:
    paths:
      - "web/scripts/mirror-repos/**"
      - ".github/workflows/sync-mirror-repos.yml"
  workflow_run:
    workflows: ["Release Packages"]
    types: [completed]
  workflow_dispatch:

defaults:
  run:
    working-directory: web

concurrency:
  group: web-mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  selection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun scripts/mirror-repos/verify-selection.ts

  sync:
    needs: selection-contract
    if: >-
      vars.LOYAL_MIRROR_SYNC_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify mirror selection
        run: bun scripts/mirror-repos/verify-selection.ts

      - name: Sync mirrors
        run: |
          if [ -z "$MIRROR_SYNC_TOKEN" ]; then
            echo "MIRROR_SYNC_TOKEN is required to push generated mirrors."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun run scripts/mirror-repos/sync.ts --skip-if-packages-unpublished
          else
            bun run scripts/mirror-repos/sync.ts --skip-if-packages-unpublished --changed-only
          fi
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
