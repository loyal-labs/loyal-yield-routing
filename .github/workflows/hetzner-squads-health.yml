name: Hetzner Squads native health candidate
on:
  push:
    branches: [hetzner/squads-native-health-20261004]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang pkg-config libssl-dev protobuf-compiler git ca-certificates
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-deps-linux-amd64-rust-1.89-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-linux-amd64-rust-1.89-
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: squads-health-linux-amd64-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-target-linux-amd64-rust-1.89-v2-light-workers-
            rust-target-linux-amd64-rust-1.89-v1-
            rust-release-linux-amd64-rust-1.89-
      - name: Check and exercise native telemetry contracts
        run: cargo test --release --locked -p loyal-squads-policy-monitor --test native_health --test health_writer -- --nocapture
      - name: Build the sole changed executable
        run: |
          cargo build --release --locked -p loyal-squads-policy-monitor --bin loyal-squads-policy-monitor
          mkdir -p build-artifacts/squads
          cp target/release/loyal-squads-policy-monitor build-artifacts/squads/
          sha256sum build-artifacts/squads/loyal-squads-policy-monitor > build-artifacts/squads/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: squads-native-health-linux-amd64
          path: build-artifacts/squads
          retention-days: 3
          compression-level: 0
  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: squads-native-health-linux-amd64
          path: build-artifacts/squads
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Package immutable dedicated candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.squads-health
          platforms: linux/amd64
          push: true
          tags: ghcr.io/loyal-labs/loyal-yield-routing/loyal-squads-policy-monitor-health:sha-${{ github.sha }}
          build-args: LOYAL_IMAGE_VERSION=${{ github.sha }}
          provenance: false
          sbom: false
