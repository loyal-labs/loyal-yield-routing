name: backyard-rwa-worker-image

on:
  pull_request:
    paths:
      - .github/workflows/backyard-rwa-worker-image.yml
      - Dockerfile.backyard-rwa-worker
      - go/backyard-rwa-worker/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/backyard-rwa-worker-image.yml
      - Dockerfile.backyard-rwa-worker
      - go/backyard-rwa-worker/**

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: loyal-labs/loyal-yield-routing

jobs:
  package:
    name: Package Backyard RWA Go worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/backyard-rwa-worker/go.mod
          cache-dependency-path: go/backyard-rwa-worker/go.sum
      - name: Verify worker
        working-directory: go/backyard-rwa-worker
        run: |
          go test ./...
          go vet ./...
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backyard-rwa-worker
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backyard-rwa-worker:sha-${{ github.sha }}
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=backyard-rwa-worker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=backyard-rwa-worker,mode=max' || '' }}
      - name: Pull published image for probe
        if: github.event_name == 'push'
        run: docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAMESPACE}/backyard-rwa-worker:sha-${GITHUB_SHA}"
      - name: Probe runtime image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backyard-rwa-worker:sha-${{ github.sha }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE" | grep -Fx 'linux/amd64'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" | grep -Fx "$GITHUB_SHA"
          docker image inspect "$IMAGE" | jq -e --arg version "LOYAL_IMAGE_VERSION=sha-$GITHUB_SHA" \
            '.[0].Config.Cmd == ["/usr/local/bin/backyard-rwa-worker"] and (.[0].Config.Env | index($version)) != null and .[0].Config.User == "10001:10001"' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --entrypoint test "$IMAGE" \
            -x /usr/local/bin/backyard-rwa-worker
