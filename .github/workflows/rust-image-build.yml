name: reusable-rust-image-build

on:
  workflow_call:
    inputs:
      publish:
        description: Push packaged images to GHCR
        required: false
        default: false
        type: boolean
      package-images:
        description: Package and probe runtime images after compiling
        required: false
        default: true
        type: boolean
      save-caches:
        description: Save refreshed Cargo state for later builds
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: loyal-labs/loyal-yield-routing
  CARGO_DEPENDENCY_CACHE_PREFIX: cargo-deps-linux-amd64-rust-1.89
  RUST_TARGET_CACHE_PREFIX: rust-target-linux-amd64-rust-1.89-v2
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  LASERSTREAM_PROBE_BINARIES: kamino-reserve-monitor balance-sweep-ata-monitor loyal-timescale-migrations yield-migrations
  LIGHT_WORKER_PROBE_BINARIES: balance-sweep-ata-projector balance-sweep-autodeposit-trigger loyal-yield-realtime loyal-squads-policy-monitor yield-migrations same-mint-reserve-swap same-mint-yield-monitor fleet-opportunity-planner fleet-health-projector fleet-route-confirmer multiply-route-worker route-lookup-table-provisioner
  OPERATOR_TOOLS_PROBE_BINARIES: loyal-timescale-migrations fleet-orchestration-verifier fleet-orchestration-production-evidence same-mint-monitor-e2e route-lookup-table-shared-catalog route-lookup-table-alert-monitor route-lookup-table-legacy-import route-lookup-table-cleanup signer-balance-monitor

jobs:
  rust-build:
    name: Build Rust binaries (${{ matrix.family }})
    runs-on: ubuntu-latest
    container: rust:1.89-bookworm
    strategy:
      fail-fast: false
      matrix:
        family:
          - laserstream-workers
          - light-workers
          - operator-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang git jq libssl-dev pkg-config protobuf-compiler python3 ripgrep
          rm -rf /var/lib/apt/lists/*

      - name: Restore Cargo dependency state
        id: cargo-dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ env.CARGO_DEPENDENCY_CACHE_PREFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ env.CARGO_DEPENDENCY_CACHE_PREFIX }}-

      - name: Select Cargo target cache generation
        id: cargo-target-generation
        run: echo "utc-date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Each family keeps its own feature-compatible target snapshot. The
      # revision marker below makes only source paths changed since that
      # snapshot newer than Cargo's restored fingerprints. A daily generation
      # bounds snapshot drift without uploading target state on every commit.
      - name: Restore trusted Cargo target state
        id: cargo-target-cache
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ${{ env.RUST_TARGET_CACHE_PREFIX }}-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}-${{ steps.cargo-target-generation.outputs.utc-date }}
          restore-keys: |
            ${{ env.RUST_TARGET_CACHE_PREFIX }}-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}-
            ${{ env.RUST_TARGET_CACHE_PREFIX }}-${{ matrix.family }}-
            rust-target-linux-amd64-rust-1.89-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}
            rust-target-linux-amd64-rust-1.89-v1-
            rust-release-linux-amd64-rust-1.89-${{ hashFiles('Cargo.lock') }}-

      - name: Set up content-addressed Rust compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Verify parallel image-family workflow contract
        run: bash scripts/verify-rust-image-build-once.sh

      - name: Prepare restored Cargo target state
        run: python3 scripts/prepare-rust-target-cache.py restore

      - name: Compile and stage image-family Rust binaries
        run: bash scripts/build-rust-image-binaries.sh --family "${{ matrix.family }}"

      - name: Record Cargo target source revision
        run: python3 scripts/prepare-rust-target-cache.py record

      - name: Upload compiled binaries
        if: inputs.package-images
        uses: actions/upload-artifact@v4
        with:
          name: rust-image-binaries-${{ matrix.family }}
          path: build-artifacts/rust
          if-no-files-found: error
          retention-days: 1
          # Level 1 cuts the family artifacts by roughly 58% while adding only
          # a few seconds before the package jobs download them.
          compression-level: 1

      # The scheduled default-branch refresh owns these multi-gigabyte uploads,
      # so publishing a main commit never waits for cache compression.
      - name: Save trusted Cargo target state
        if: inputs.save-caches && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.cargo-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ env.RUST_TARGET_CACHE_PREFIX }}-${{ matrix.family }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/*/Cargo.toml') }}-${{ steps.cargo-target-generation.outputs.utc-date }}

      - name: Save trusted Cargo dependency state
        if: inputs.save-caches && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && matrix.family == 'light-workers' && steps.cargo-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ env.CARGO_DEPENDENCY_CACHE_PREFIX }}-${{ hashFiles('Cargo.lock') }}

  laserstream-workers:
    name: Package laserstream workers
    if: inputs.package-images
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-image-binaries-laserstream-workers
          path: build-artifacts/rust
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.laserstream-workers
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          load: ${{ inputs.publish == false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/laserstream-workers:sha-${{ github.sha }}
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=laserstream-workers-runtime
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=laserstream-workers-runtime,mode=max' || '' }}
      - name: Pull published image for probe
        if: inputs.publish
        run: docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAMESPACE}/laserstream-workers:sha-${GITHUB_SHA}"
      - name: Probe runtime image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/laserstream-workers:sha-${{ github.sha }}
          PROBE_BINARIES: ${{ env.LASERSTREAM_PROBE_BINARIES }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE" | grep -Fx 'linux/amd64'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" | grep -Fx "$GITHUB_SHA"
          docker image inspect "$IMAGE" | jq -e --arg version "LOYAL_IMAGE_VERSION=sha-$GITHUB_SHA" \
            '.[0].Config.Cmd == ["/usr/local/bin/kamino-reserve-monitor"] and (.[0].Config.Env | index($version)) != null' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --env PROBE_BINARIES --security-opt=no-new-privileges --entrypoint sh "$IMAGE" -c \
            'for binary in $PROBE_BINARIES; do test -x "/usr/local/bin/$binary"; done
             test -x /usr/local/bin/kamino-monitor-predeploy'

  light-workers:
    name: Package light workers
    if: inputs.package-images
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-image-binaries-light-workers
          path: build-artifacts/rust
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.light-workers
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          load: ${{ inputs.publish == false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/light-workers:sha-${{ github.sha }}
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=light-workers-runtime
      - name: Pull published image for probe
        if: inputs.publish
        run: docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAMESPACE}/light-workers:sha-${GITHUB_SHA}"
      - name: Probe runtime image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/light-workers:sha-${{ github.sha }}
          PROBE_BINARIES: ${{ env.LIGHT_WORKER_PROBE_BINARIES }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE" | grep -Fx 'linux/amd64'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" | grep -Fx "$GITHUB_SHA"
          docker image inspect "$IMAGE" | jq -e --arg version "LOYAL_IMAGE_VERSION=sha-$GITHUB_SHA" \
            '.[0].Config.Cmd == ["/usr/local/bin/balance-sweep-ata-projector"] and (.[0].Config.Env | index($version)) != null' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --env PROBE_BINARIES --security-opt=no-new-privileges --entrypoint sh "$IMAGE" -c \
            'for binary in $PROBE_BINARIES; do test -x "/usr/local/bin/$binary"; done
             test -x /usr/local/bin/bun
             test -e /app/node_modules
             /usr/local/bin/bun -e "await import(\"/app/scripts/execute-autodeposit-policy.ts\")"'
      - name: Probe all fleet role entrypoints
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/light-workers:sha-${{ github.sha }}
        run: |
          probe_role() {
            expected_role="$1"
            shift
            output="$(docker run --rm --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --entrypoint "$1" "$IMAGE" "${@:2}")"
            jq -e --arg role "$expected_role" \
              '.schemaVersion == 1 and .event == "fleet_worker_role_probe" and .status == "pass" and .role == $role and .networkAccessed == false and .secretsLoaded == false and .databaseMutated == false and .transactionSent == false' \
              <<<"$output" >/dev/null
          }
          probe_role planner /usr/local/bin/fleet-opportunity-planner --role-probe
          probe_role revalidator /usr/local/bin/same-mint-reserve-swap --fleet-worker revalidate --role-probe
          probe_role executor /usr/local/bin/same-mint-reserve-swap --fleet-worker execute --role-probe
          probe_role confirmer /usr/local/bin/fleet-route-confirmer --role-probe
          probe_role reconciler /usr/local/bin/same-mint-reserve-swap --fleet-reconciler --role-probe
          probe_role multiply_route_worker /usr/local/bin/multiply-route-worker --role-probe
          probe_role priority_provisioner /usr/local/bin/route-lookup-table-provisioner --role-probe

  operator-tools:
    name: Package operator tools
    if: inputs.package-images
    needs: rust-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-image-binaries-operator-tools
          path: build-artifacts/rust
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator-tools
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          load: ${{ inputs.publish == false }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/operator-tools:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: ${{ inputs.publish && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=operator-tools-runtime
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=operator-tools-runtime,mode=max' || '' }}
      - name: Pull published image for probe
        if: inputs.publish
        run: docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAMESPACE}/operator-tools:sha-${GITHUB_SHA}"
      - name: Probe runtime image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/operator-tools:sha-${{ github.sha }}
          PROBE_BINARIES: ${{ env.OPERATOR_TOOLS_PROBE_BINARIES }}
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE" | grep -Fx 'linux/amd64'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" | grep -Fx "$GITHUB_SHA"
          docker image inspect "$IMAGE" | jq -e \
            '.[0].Config.Cmd == ["/usr/local/bin/fleet-orchestration-verifier", "--help"]' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --env PROBE_BINARIES --security-opt=no-new-privileges --entrypoint sh "$IMAGE" -c \
            'for binary in $PROBE_BINARIES; do test -x "/usr/local/bin/$binary"; done'
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges "$IMAGE" >/dev/null
