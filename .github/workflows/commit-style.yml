name: Commit Style

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

defaults:
  run:
    working-directory: web

permissions:
  contents: read

jobs:
  check-commit-style:
    runs-on: ubuntu-latest
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the pull request restores no older file content
        working-directory: .
        run: scripts/ci-no-silent-revert.sh "origin/$PR_BASE_REF" "$PR_HEAD_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check commit messages in PR
        run: bunx commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose

      - name: Check pull request title
        run: echo "$PR_TITLE" | bunx commitlint --verbose
