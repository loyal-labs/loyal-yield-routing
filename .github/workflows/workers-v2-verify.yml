name: Workers v2 branch verification

on:
  push:
    branches: [main]
    paths:
      - go/workers/**
      - scripts/verify-workers-v2.sh
      - scripts/check-go-ts-refs.sh
      - scripts/build-svm-fixtures.sh
      - scripts/prepare-vault-withdrawal-test-db.sh
      - scripts/clickstack-*
      - scripts/fixtures/clickstack-*
      - deploy/hetzner/monitoring/clickstack-*
      - migrations/**
      # The fixtures the backyard Go tests read.
      - docs/evidence/backyard-rwa-go/**
      - .github/workflows/workers-v2-verify.yml
      # The Rust workspace the connected SVM fixtures build in, and the
      # crates they build with their workspace dependencies.
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/squads-test-harness/**
      - crates/mock-yield-protocols-program/**
      - crates/loyal-actions/**
      - crates/loyal-solana-env/**
      - crates/loyal-hub-abi/**
      - crates/loyal-voltr-rwa-nav-adaptor/**

  # Every PR reports the required checks; the changes job skips them when
  # no workers path changed.
  pull_request:
    branches: [main]

env:
  # The runner has 4 vCPUs.
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: workers-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/clickstack-vault-alerts_test.py
      - run: python3 scripts/clickstack-looping-alerts_test.py

  changes:
    runs-on: ubuntu-24.04
    outputs:
      workers: ${{ steps.diff.outputs.workers }}
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Pushes are already filtered by the push paths above, and always
        # replay the Rust golden fixtures; PRs replay them when a crate input changed.
        run: |
          if test "$GITHUB_EVENT_NAME" = push || git diff --name-only "$BASE" HEAD | grep -qE '^(Cargo\.(toml|lock)$|rust-toolchain\.toml$|crates/)'; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi
          if test "$GITHUB_EVENT_NAME" = push || git diff --name-only "$BASE" HEAD | grep -qE '^(go/workers/|migrations/|docs/evidence/backyard-rwa-go/|scripts/(verify-workers-v2\.sh|check-go-ts-refs\.sh|build-svm-fixtures\.sh|prepare-vault-withdrawal-test-db\.sh)$|\.github/workflows/workers-v2-verify\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|crates/(squads-test-harness|mock-yield-protocols-program|loyal-actions|loyal-solana-env|loyal-hub-abi|loyal-voltr-rwa-nav-adaptor)/)'; then
            echo workers=true >> "$GITHUB_OUTPUT"
          else
            echo workers=false >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The Go tests that need Postgres skip when their env var is unset, and a
    # skip on trunk hid breakage twice. Packages run serially because bridge
    # and webapp tests create and drop the same loyal_yield schema.
    env:
      BRIDGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bridge_test?sslmode=disable
      EARNMAX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/earnmax_test?sslmode=disable
      BACKYARD_FOREIGN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/backyard_foreign_test?sslmode=disable
      EVM_DEPOSIT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/evm_deposit_ci_test?sslmode=disable
      BACKYARD_WITHDRAWAL_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/vault_cost_test_ci?sslmode=disable
      EARNMAX_WITHDRAWAL_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/vault_cost_test_ci?sslmode=disable
      VAULT_CONSENT_TEST_ADMIN_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the disposable test databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in bridge_test earnmax_test backyard_foreign_test evm_deposit_ci_test; do
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Prepare withdrawal regressions with production lifecycle constraints
        run: bash scripts/prepare-vault-withdrawal-test-db.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # verify-workers-v2.sh keeps its own caches; the steps below carry them.
          cache: false
      # Go builds are content-addressed, so the newest entry for this go.sum
      # is a valid start; every main push writes one, PRs only read.
      - name: Restore Go module and build caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/workers-go
          key: workers-go-${{ hashFiles('go/workers/go.sum') }}-${{ github.sha }}
          restore-keys: workers-go-${{ hashFiles('go/workers/go.sum') }}
      # The fixtures are a pure function of these sources and the pinned tools.
      - name: Restore connected execution fixtures
        id: fixtures
        uses: actions/cache@v4
        with:
          path: |
            target/deploy/mock_yield_protocols_program.so
            target/debug/examples/fleet-local-svm
            target/svm-fixtures
          key: svm-fixtures-v2-agave-3.1.12-sbf-1.52-${{ hashFiles('scripts/build-svm-fixtures.sh', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/squads-test-harness/**', 'crates/mock-yield-protocols-program/**', 'crates/loyal-actions/**', 'crates/loyal-solana-env/**', 'crates/loyal-hub-abi/**') }}
      - name: Install pinned SBF build tools
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/solana-release.tar.bz2"
          echo "4d45dab6ccfe5321292ad6dc152f7ace71ccbddde5ecda0aaa3f92bbfe8ed803  $RUNNER_TEMP/solana-release.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/solana-release.tar.bz2" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/solana-release.tar.bz2"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build local connected execution fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: bash scripts/build-svm-fixtures.sh
      - name: Replay the golden fixtures through the Rust crates
        # The golden tests read only crate files.
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked -p loyal-actions -p loyal-voltr-rwa-nav-adaptor golden_
      - name: Verify Voltr deposit pricing and withdrawal protection in the SBF harness
        # Executes the committed TS-signed wires on captured mainnet Squads, Voltr and Lighthouse.
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked -p squads-test-harness --test voltr_withdrawal_protection --test voltr_deposit_pricing
      - name: Verify offline behavior
        env:
          SVM_HARNESS: ${{ github.workspace }}/target/debug/examples/fleet-local-svm
          AUTODEPOSIT_TEST_SVM_FIXTURE_PATH: ${{ github.workspace }}/target/svm-fixtures/autodeposit.json
          MOCK_YIELD_PROTOCOLS_PROGRAM_SO: ${{ github.workspace }}/target/deploy/mock_yield_protocols_program.so
          SQUADS_SMART_ACCOUNT_PROGRAM_SO: ${{ github.workspace }}/crates/squads-test-harness/fixtures/squads/squads_smart_account_program.so
          WORKERS_V2_CACHE_DIR: ${{ runner.temp }}/workers-go
          WORKERS_V2_RACE: ${{ github.event_name == 'push' && '1' || '' }}
        run: bash scripts/verify-workers-v2.sh
      - name: Database tests ran and were not skipped
        working-directory: go/workers
        env:
          WORKERS_V2_CACHE_DIR: ${{ runner.temp }}/workers-go
        run: |
          export GOTOOLCHAIN=local GOENV=off
          export GOMODCACHE="$WORKERS_V2_CACHE_DIR/gomod" GOCACHE="$WORKERS_V2_CACHE_DIR/gobuild"
          tests="TestBridgeOutQuoteIsNotServedWithoutItsRow TestTrackerStoresEachHashFromTheStatusThatCarriedIt TestForeignInflowStoreCommitsEvidenceAndCursorTogether TestExitLiabilityUsesConfirmedReportAtEachMark TestEvmDepositRelaySignedRefusesEmbeddedWalletWhenPrivyLookupIsEmpty TestEvmDepositConcurrentPostsMakeOnePrivyCreate TestWithdrawalCostDatabaseCrossWorkerReservationAndConsentWidening TestWithdrawalCostDatabaseCoveredSaleAndObservationOrdering TestWithdrawalCostDatabaseLoaderUsesActualGenerationAndEscrow TestWithdrawalCostDatabaseSimulationDisclosureCrashRetainsExactWire TestWithdrawalCostDatabaseDisclosedFailureAndManualLandingSatisfyProductionConstraint TestWithdrawalCostDatabaseEngineSweepsWithoutDemandOrNewSigning TestWithdrawalCostDatabaseSweepTimeoutDoesNotStarveLaterWireAndJoins TestWithdrawalAttemptDatabaseFeeReservationSurvivesWideningAndRetries TestWithdrawalConsentStoreConcurrentImmutableVersions TestWithdrawalCostStatusGenerationVersionsAndUnknown"
          log="$RUNNER_TEMP/dbtests.log"
          go test -p 1 -count=1 -v -run "^($(echo $tests | tr ' ' '|'))\$" ./internal/bridge ./internal/backyard ./internal/earnmax ./internal/webapp | tee "$log"
          ! grep -- '--- SKIP' "$log"
          for t in $tests; do grep -q -- "--- PASS: $t " "$log"; done
      - name: Save Go module and build caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/workers-go
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  workers-image:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    # This job only builds and probes a local CI image. No registry credentials,
    # publishing, production environment or deployment permission is granted.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's Go cache mounts start empty on every runner. Like the
      # verify job's cache, main writes it and PRs only restore it.
      - name: Restore the image's Go caches
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            image-go-build
            image-go-mod
          key: workers-image-go-${{ hashFiles('go/workers/go.sum') }}-${{ github.sha }}
          restore-keys: workers-image-go-${{ hashFiles('go/workers/go.sum') }}-
      - name: Restore and save the image's Go caches
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            image-go-build
            image-go-mod
          key: workers-image-go-${{ hashFiles('go/workers/go.sum') }}-${{ github.sha }}
          restore-keys: workers-image-go-${{ hashFiles('go/workers/go.sum') }}-
      - name: Mount the Go caches into the build
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "image-go-build": "/root/.cache/go-build",
              "image-go-mod": "/go/pkg/mod"
            }
          skip-extraction: ${{ github.event_name != 'push' }}
      - name: Build the Go runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/workers/Dockerfile
          platforms: linux/amd64
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          tags: loyal-workers-v2:verification
          push: false
          load: true
          cache-from: type=gha,scope=workers-v2-image
          cache-to: type=gha,mode=min,scope=workers-v2-image
      - name: Probe all Go roles with network and writers unavailable
        run: |
          for role in loyal-engine loyal-observer loyal-evidence; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              --entrypoint /usr/local/bin/$role loyal-workers-v2:verification --role-probe
          done
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh loyal-workers-v2:verification \
            -ec 'cd /usr/local/bin; sha256sum -c /usr/local/share/loyal-workers/SHA256SUMS; test "$(id -u)" = 65532'

  # deploy-workers.sh deploys a commit only when this artifact exists for its
  # inputs. A PR run names it after the merge commit it tested.
  verified:
    needs: [verify, workers-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: key
        run: echo "name=$(bash scripts/ci-tree-key.sh HEAD)" >> "$GITHUB_OUTPUT"
      - run: git rev-parse HEAD > verified-commit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}
          path: verified-commit
          overwrite: true
