name: Workers v2 branch verification

on:
  push:
    branches: [main, 'codex/workers-v2*']
    paths:
      - go/workers/**
      - scripts/verify-workers-v2.sh
      - scripts/workers-v2-fixture.py
      - migrations/**
      - .github/workflows/workers-v2-verify.yml
      # Sources bound by the Backyard Voltr policy authorization.
      - Cargo.toml
      - Cargo.lock
      - crates/loyal-actions/**
      - tools/backyard-voltr/**
      - docs/evidence/backyard-voltr-four-market/**
      # Go tests run the SDK oracles and the connected SVM helper from these.
      - package.json
      - bun.lock
      - rust-toolchain.toml
      - crates/squads-test-harness/**
      - crates/mock-yield-protocols-program/**

permissions:
  contents: read

concurrency:
  group: workers-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workers_v2
          POSTGRES_DB: workers_v2_bootstrap
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U workers_v2 -d workers_v2_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      timescale:
        image: timescale/timescaledb:2.20.3-pg17
        env:
          POSTGRES_USER: workers_v2
          POSTGRES_DB: workers_v2_bootstrap
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U workers_v2 -d workers_v2_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: go/workers/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the SDK oracle packages
        # backyard testdata/*.mjs resolve @solana/web3.js and the Squads SDK
        # from the root package and the Kamino SDK from tools/backyard-voltr.
        run: |
          bun install --frozen-lockfile
          (cd tools/backyard-voltr && bun install --frozen-lockfile)
      - name: Install the pinned Rust and Solana SBF toolchains
        run: |
          rustup toolchain install
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workers-v2-connected-svm
      - name: Build the connected SVM helper and mock protocol program
        # Fleet connected execution runs Go against actual Squads SBF and the
        # mock KLend/Jupiter SBF inside this LiteSVM helper.
        run: |
          cargo build --locked -p squads-test-harness --example fleet-local-svm
          cargo build-sbf --manifest-path crates/mock-yield-protocols-program/Cargo.toml -- --locked
          echo "KAMINO_CONNECTED_SVM_PATH=$PWD/target/debug/examples/fleet-local-svm" >> "$GITHUB_ENV"
          echo "MOCK_YIELD_PROTOCOLS_PROGRAM_SO=$PWD/target/deploy/mock_yield_protocols_program.so" >> "$GITHUB_ENV"
      - name: Apply actual schema to isolated family databases
        env:
          WORKERS_V2_DISPOSABLE: '1'
          WORKERS_V2_FIXTURE_URL: postgresql://workers_v2@127.0.0.1:${{ job.services.postgres.ports[5432] }}/workers_v2_bootstrap
          WORKERS_V2_TIMESCALE_FIXTURE_URL: postgresql://workers_v2@127.0.0.1:${{ job.services.timescale.ports[5432] }}/workers_v2_bootstrap
        run: python3 scripts/workers-v2-fixture.py
      - name: Verify offline and enabled database behavior
        run: bash scripts/verify-workers-v2.sh

  backyard-voltr-authorization:
    # Every authorization-gated Backyard Voltr command refuses when a bound
    # source drifts from the committed policy catalog authorization.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          # Verified to install bun.lock (configVersion 1) frozen.
          bun-version: 1.3.14
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: backyard-voltr-policy-compiler
      - name: Build the runtime policy compiler
        # Loading the authorization recompiles the catalog with this binary.
        run: cargo build --locked -p loyal-actions --bin compile-voltr-kamino-runtime-policy
      - name: Committed authorization binds the checked-out sources
        working-directory: tools/backyard-voltr
        run: |
          bun install --frozen-lockfile
          bun test src/policies/authorization.test.ts
          git diff --exit-code

  image:
    # This job only builds and probes a local CI image. No registry credentials,
    # publishing, production environment or deployment permission is granted.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the Go runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/workers/Dockerfile
          platforms: linux/amd64
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          tags: loyal-workers-v2:verification
          push: false
          load: true
          cache-from: type=gha,scope=workers-v2-image
          cache-to: type=gha,mode=min,scope=workers-v2-image
      - name: Probe all Go roles with network and writers unavailable
        run: |
          for role in loyal-engine loyal-observer loyal-evidence; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              --entrypoint /usr/local/bin/$role loyal-workers-v2:verification --role-probe
          done
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh loyal-workers-v2:verification \
            -ec 'cd /usr/local/bin; sha256sum -c /usr/local/share/loyal-workers/SHA256SUMS; test "$(id -u)" = 65532'
