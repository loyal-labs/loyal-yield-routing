name: Workers v2 branch verification

on:
  push:
    branches: [main]
    paths:
      - go/workers/**
      - scripts/verify-workers-v2.sh
      - scripts/workers-v2-fixture.py
      - scripts/build-svm-fixtures.sh
      - migrations/**
      - .github/workflows/workers-v2-verify.yml
      # The Rust workspace the connected SVM fixtures build in, and the
      # crates they build with their workspace dependencies.
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/squads-test-harness/**
      - crates/mock-yield-protocols-program/**
      - crates/loyal-actions/**
      - crates/loyal-solana-env/**
      - crates/loyal-hub-abi/**
      # The bun installs below.
      - package.json
      - bun.lock
      - tools/backyard-voltr/package.json
      - tools/backyard-voltr/bun.lock

  # Every PR reports the required checks; the changes job skips them when
  # no workers path changed.
  pull_request:
    branches: [main]

env:
  # The runner has 4 vCPUs.
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: workers-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      workers: ${{ steps.diff.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Pushes are already filtered by the push paths above.
        run: |
          if test "$GITHUB_EVENT_NAME" = push || git diff --name-only "$BASE" HEAD | grep -qE '^(go/workers/|migrations/|scripts/(verify-workers-v2\.sh|workers-v2-fixture\.py|build-svm-fixtures\.sh)$|\.github/workflows/workers-v2-verify\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|package\.json$|bun\.lock$|crates/(squads-test-harness|mock-yield-protocols-program|loyal-actions|loyal-solana-env|loyal-hub-abi)/|tools/backyard-voltr/(package\.json|bun\.lock)$)'; then
            echo workers=true >> "$GITHUB_OUTPUT"
          else
            echo workers=false >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workers_v2
          POSTGRES_DB: workers_v2_bootstrap
          POSTGRES_HOST_AUTH_METHOD: trust
        # The Phase3 tests require this disposable socket prefix and their own DB.
        volumes:
          - /private/tmp/backyard-phase3-pg.ci:/var/run/postgresql
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U workers_v2 -d workers_v2_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      timescale:
        image: timescale/timescaledb:2.20.3-pg17
        env:
          POSTGRES_USER: workers_v2
          POSTGRES_DB: workers_v2_bootstrap
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U workers_v2 -d workers_v2_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # verify-workers-v2.sh keeps its own caches; the steps below carry them.
          cache: false
      # One cache per go.sum. Go builds are content-addressed, so an entry
      # stays a valid start until go.sum changes; only main writes it.
      - name: Restore Go module and build caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/workers-go
          key: workers-go-${{ hashFiles('go/workers/go.sum') }}
      # The fixtures are a pure function of these sources and the pinned tools.
      - name: Restore connected execution fixtures
        id: fixtures
        uses: actions/cache@v4
        with:
          path: |
            target/deploy/mock_yield_protocols_program.so
            target/debug/examples/fleet-local-svm
            target/svm-fixtures
          key: svm-fixtures-v2-agave-3.1.12-sbf-1.52-${{ hashFiles('scripts/build-svm-fixtures.sh', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/squads-test-harness/**', 'crates/mock-yield-protocols-program/**', 'crates/loyal-actions/**', 'crates/loyal-solana-env/**', 'crates/loyal-hub-abi/**') }}
      - name: Install pinned SBF build tools
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/solana-release.tar.bz2"
          echo "4d45dab6ccfe5321292ad6dc152f7ace71ccbddde5ecda0aaa3f92bbfe8ed803  $RUNNER_TEMP/solana-release.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/solana-release.tar.bz2" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/solana-release.tar.bz2"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build local connected execution fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: bash scripts/build-svm-fixtures.sh
      - name: Apply actual schema to isolated family databases
        env:
          WORKERS_V2_DISPOSABLE: '1'
          WORKERS_V2_FIXTURE_URL: postgresql://workers_v2@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/workers_v2_bootstrap
          WORKERS_V2_TIMESCALE_FIXTURE_URL: postgresql://workers_v2@127.0.0.1:${{ job.services.timescale.ports['5432'] }}/workers_v2_bootstrap
        run: python3 scripts/workers-v2-fixture.py
      - name: Create the separate Phase3 test database
        # Tests create their own stand-in schema; do not apply family migrations here.
        env:
          PGHOST: /private/tmp/backyard-phase3-pg.ci
          PGPORT: '5432'
          PGUSER: workers_v2
          PGDATABASE: workers_v2_bootstrap
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE phase3_budget_test'
      - name: Verify offline and enabled database behavior
        env:
          PHASE3_TEST_DATABASE_URL: postgresql://workers_v2@/phase3_budget_test?host=/private/tmp/backyard-phase3-pg.ci&port=5432
          SVM_HARNESS: ${{ github.workspace }}/target/debug/examples/fleet-local-svm
          MULTIPLY_FIXTURE_BIN: ${{ github.workspace }}/target/svm-fixtures/workers-v2-multiply
          AUTODEPOSIT_TEST_SVM_FIXTURE_PATH: ${{ github.workspace }}/target/svm-fixtures/autodeposit.json
          MOCK_YIELD_PROTOCOLS_PROGRAM_SO: ${{ github.workspace }}/target/deploy/mock_yield_protocols_program.so
          SQUADS_SMART_ACCOUNT_PROGRAM_SO: ${{ github.workspace }}/crates/squads-test-harness/fixtures/squads/squads_smart_account_program.so
          WORKERS_V2_CACHE_DIR: ${{ runner.temp }}/workers-go
        run: bash scripts/verify-workers-v2.sh
      - name: Save Go module and build caches
        if: github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/workers-go
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  workers-image:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    # This job only builds and probes a local CI image. No registry credentials,
    # publishing, production environment or deployment permission is granted.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the Go runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/workers/Dockerfile
          platforms: linux/amd64
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          tags: loyal-workers-v2:verification
          push: false
          load: true
          cache-from: type=gha,scope=workers-v2-image
          cache-to: type=gha,mode=min,scope=workers-v2-image
      - name: Probe all Go roles with network and writers unavailable
        run: |
          for role in loyal-engine loyal-observer loyal-evidence; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              --entrypoint /usr/local/bin/$role loyal-workers-v2:verification --role-probe
          done
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh loyal-workers-v2:verification \
            -ec 'cd /usr/local/bin; sha256sum -c /usr/local/share/loyal-workers/SHA256SUMS; test "$(id -u)" = 65532'
