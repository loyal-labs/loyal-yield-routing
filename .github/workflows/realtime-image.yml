name: realtime-image

# Builds the light-workers image, which now holds only loyal-yield-realtime.
# The production workflow publishes the image and deploys its verified binary.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-${{ github.sha }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.light-workers
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.IMAGE }}
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=realtime-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=realtime-image,mode=max' || '' }}
      - if: env.PUBLISH == 'true'
        run: docker pull --platform linux/amd64 "$IMAGE"
      - name: Probe the realtime binary
        run: |
          docker image inspect "$IMAGE" | jq -e '.[0].Config.Cmd == ["/usr/local/bin/loyal-yield-realtime"]' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint sh "$IMAGE" -c 'test -x /usr/local/bin/loyal-yield-realtime'
      - name: Extract the verified realtime binary
        if: env.PUBLISH == 'true'
        run: |
          mkdir release
          container=$(docker create "$IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/loyal-yield-realtime" release/
          cd release
          sha256sum loyal-yield-realtime > realtime-SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: production-realtime-${{ github.sha }}
          overwrite: true
          path: release/
          if-no-files-found: error
          retention-days: 7
