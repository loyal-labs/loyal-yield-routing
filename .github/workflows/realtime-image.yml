name: realtime-image

# Builds the light-workers image, which now holds only loyal-yield-realtime.
# Main pushes publish an immutable sha-<commit> tag; Render stays pinned.
on:
  pull_request:
    paths:
      - .github/workflows/realtime-image.yml
      - Dockerfile.light-workers
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/loyal-observability/**
      - crates/loyal-yield-realtime/**
      - crates/loyal-yield-realtime-core/**
  push:
    branches: [main]
    paths:
      - .github/workflows/realtime-image.yml
      - Dockerfile.light-workers
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/loyal-observability/**
      - crates/loyal-yield-realtime/**
      - crates/loyal-yield-realtime-core/**

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-${{ github.sha }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.light-workers
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.IMAGE }}
          build-args: LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=realtime-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=realtime-image,mode=max' || '' }}
      - if: env.PUBLISH == 'true'
        run: docker pull --platform linux/amd64 "$IMAGE"
      - name: Probe the realtime binary
        run: |
          docker image inspect "$IMAGE" | jq -e '.[0].Config.Cmd == ["/usr/local/bin/loyal-yield-realtime"]' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint sh "$IMAGE" -c 'test -x /usr/local/bin/loyal-yield-realtime'
