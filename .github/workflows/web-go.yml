name: loyal-web

on:
  pull_request:
    branches: [main]
    paths:
      - web/**
      - go/workers/cmd/loyal-web/**
      - go/workers/internal/webapp/**
      - go/workers/internal/webserve/**
      - go/workers/cmd/loyal-admin/**
      - go/workers/internal/admin/**
      - go/workers/internal/earnmax/**
      - go/workers/cmd/loyal-stats/**
      - go/workers/internal/stats/**
      - go/workers/internal/earnstats/**
      - scripts/web/**
      - scripts/deploy-workers.sh
      - deploy/hetzner/activate.sh
      - deploy/hetzner/retain-web-assets.sh
      - .github/workflows/web-go.yml

permissions:
  contents: read

concurrency:
  group: loyal-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_GIT_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/workers/go.mod
          cache-dependency-path: go/workers/go.sum
      - name: install web
        run: cd web && bun install --frozen-lockfile
      - name: assets survive releases and startup recovers without reload loops
        timeout-minutes: 2
        run: |
          sh scripts/web/verify-retained-assets.sh
          browser_path="$(command -v google-chrome)"
          CHROMIUM_PATH="$browser_path" node scripts/web/verify-startup-recovery.mjs
      - name: every Next page has a route
        run: |
          bun scripts/web/gen-routes.ts --check
          bun scripts/web/gen-routes.ts --app admin --check
      - name: build
        run: |
          sh scripts/web/build.sh
          sh scripts/web/build.sh admin
          sh scripts/web/build.sh stats
      - name: web API types match the Go routes
        run: bun scripts/web/openapi-types.ts --check
      - name: mobile client paths have server routes
        run: bun scripts/web/routes-census.ts --check
      - name: admin view props match the Go loaders
        working-directory: web/apps/admin
        run: bun run typecheck
      - name: stats page types
        working-directory: web/apps/dashboard
        run: bun run typecheck:vite
      - name: Go headers and locale redirects match loyal-app
        run: bun scripts/web/parity.ts
      - name: go
        working-directory: go/workers
        run: |
          go vet ./cmd/loyal-web ./cmd/loyal-admin ./internal/webapp ./internal/webserve ./internal/admin ./internal/earnmax ./internal/earnprep ./internal/jwt
          go test -race ./cmd/loyal-web ./cmd/loyal-admin ./internal/webapp ./internal/webserve ./internal/admin ./internal/earnmax ./internal/earnprep ./internal/jwt

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: install web workspace
        run: cd web && bun install --frozen-lockfile
      - name: install mobile
        working-directory: web/apps/mobile
        run: bun install --frozen-lockfile
      - name: build workspace packages
        working-directory: web
        run: bun run build:solana-packages
      - name: mobile tsc
        working-directory: web/apps/mobile
        run: bunx tsc --noEmit
      - name: mobile jest
        working-directory: web/apps/mobile
        run: bun run test
      - name: solana-wallet tests
        working-directory: web
        run: |
          bun run build:solana-packages
          bun run --cwd packages/solana-wallet test
