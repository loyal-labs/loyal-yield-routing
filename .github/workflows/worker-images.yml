name: worker-images

on:
  pull_request:
    paths:
      - .github/workflows/rust-image-build.yml
      - .github/workflows/worker-images.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - Dockerfile.laserstream-workers
      - Dockerfile.light-workers
      - Dockerfile.kamino-fleet-planner
      - Dockerfile.operator-tools
      - go/kamino-fleet-planner/**
      - package.json
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
      - scripts/autodeposit-idle-vault-handoff.ts
      - scripts/build-rust-image-binaries.sh
      - scripts/durable-autodeposit-confirmation.ts
      - scripts/execute-autodeposit-policy.ts
      - scripts/kamino-monitor-predeploy.sh
      - scripts/kamino-fleet-planner-entrypoint.sh
      - scripts/verify-rust-image-build-once.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/rust-image-build.yml
      - .github/workflows/worker-images.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - Dockerfile.laserstream-workers
      - Dockerfile.light-workers
      - Dockerfile.kamino-fleet-planner
      - Dockerfile.operator-tools
      - go/kamino-fleet-planner/**
      - package.json
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
      - scripts/autodeposit-idle-vault-handoff.ts
      - scripts/build-rust-image-binaries.sh
      - scripts/durable-autodeposit-confirmation.ts
      - scripts/execute-autodeposit-policy.ts
      - scripts/kamino-monitor-predeploy.sh
      - scripts/kamino-fleet-planner-entrypoint.sh
      - scripts/verify-rust-image-build-once.sh
  schedule:
    # Safety net: repopulate Cargo snapshots that were evicted, or that no main
    # push has rebuilt recently. Trusted pushes fill missing snapshots themselves.
    - cron: "17 0 * * *"

permissions:
  contents: read
  packages: write

jobs:
  verify-pull-request:
    name: Build once and verify all images
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      publish: false
      package-images: true
      save-caches: false
    secrets: inherit

  publish-main-images:
    name: Build once and publish immutable images
    if: github.event_name == 'push'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      publish: true
      package-images: true
      save-caches: true
    secrets: inherit

  refresh-build-caches:
    name: Refresh trusted Rust build caches
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      publish: false
      package-images: false
      save-caches: true
    secrets: inherit
