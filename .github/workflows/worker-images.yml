name: worker-images

on:
  workflow_dispatch:
    inputs:
      images:
        description: Worker image selection
        type: choice
        options:
          - both
          - light-workers
          - laserstream-workers
        default: both

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: loyal-labs/loyal-yield-routing

jobs:
  build:
    name: Build worker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: laserstream-workers
            dockerfile: Dockerfile.laserstream-workers
          - image: light-workers
            dockerfile: Dockerfile.light-workers
    steps:
      - name: Check out repository
        if: inputs.images == 'both' || inputs.images == matrix.image
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: inputs.images == 'both' || inputs.images == matrix.image
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.images == 'both' || inputs.images == matrix.image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: inputs.images == 'both' || inputs.images == matrix.image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            LOYAL_IMAGE_VERSION=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
