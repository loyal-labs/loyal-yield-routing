name: worker-images

on:
  pull_request:
    paths:
      - .github/workflows/rust-image-build.yml
      - .github/workflows/worker-images.yml
      - .github/workflows/operator-tools-image.yml
      - Cargo.lock
      - Cargo.toml
      - bun.lock
      - Dockerfile.laserstream-workers
      - Dockerfile.light-workers
      - Dockerfile.operator-tools
      - package.json
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
      - scripts/build-rust-image-binaries.sh
      - scripts/execute-autodeposit-policy.ts
      - scripts/kamino-monitor-predeploy.sh
      - scripts/verify-rust-image-build-once.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/rust-image-build.yml
      - .github/workflows/worker-images.yml
      - .github/workflows/operator-tools-image.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
      - scripts/build-rust-image-binaries.sh
  workflow_dispatch:
    inputs:
      images:
        description: Image selection
        type: choice
        options:
          - workers
          - light-workers
          - laserstream-workers
          - operator-tools
          - all
        default: workers

permissions:
  contents: read
  packages: write

jobs:
  verify-pull-request:
    name: Build once and verify all images
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      images: all
      publish: false
    secrets: inherit

  warm-main-cache:
    name: Refresh trusted Rust cache
    if: github.event_name == 'push'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      images: none
      publish: false
    secrets: inherit

  publish-images:
    name: Build once and publish selected images
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/rust-image-build.yml
    with:
      images: ${{ inputs.images }}
      publish: true
    secrets: inherit
