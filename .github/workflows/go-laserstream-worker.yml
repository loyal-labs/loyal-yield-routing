name: go-laserstream-worker

on:
  pull_request:
    paths:
      - .github/workflows/go-laserstream-worker.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .sqlx/**
      - crates/balance-sweep-ata-monitor/**
      - crates/loyal-actions/**
      - crates/loyal-observability/**
      - crates/loyal-squads-policy-monitor/**
      - crates/loyal-yield-store/**
      - go/laserstream-worker/**
      - Dockerfile.go-laserstream-worker
      - scripts/build-go-laserstream-worker-binaries.sh
      - scripts/verify-go-laserstream-handoff.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/go-laserstream-worker.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .sqlx/**
      - crates/balance-sweep-ata-monitor/**
      - crates/loyal-actions/**
      - crates/loyal-observability/**
      - crates/loyal-squads-policy-monitor/**
      - crates/loyal-yield-store/**
      - go/laserstream-worker/**
      - Dockerfile.go-laserstream-worker
      - scripts/build-go-laserstream-worker-binaries.sh
      - scripts/verify-go-laserstream-handoff.sh

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/loyal-labs/loyal-yield-routing/go-laserstream-worker

jobs:
  test:
    name: Test Go worker and Earn bridge
    runs-on: ubuntu-24.04
    services:
      timescaledb:
        image: timescale/timescaledb:2.20.3-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache-dependency-path: go/laserstream-worker/go.sum
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: go-laserstream-earn-bridge
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Verify Go worker
        env:
          POSTGRES_BIN: /usr/lib/postgresql/16/bin
          TEST_TIMESCALE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable
          ALLOW_TEST_DATABASE_RESET: "1"
        run: scripts/verify-go-laserstream-handoff.sh
      - name: Vet Go worker
        working-directory: go/laserstream-worker
        run: go vet ./...
      - name: Test Earn domain bridge and Go protobuf compatibility
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --locked -p balance-sweep-ata-monitor --bin earn-domain-bridge
      - name: Build deployable binaries once
        run: scripts/build-go-laserstream-worker-binaries.sh
      - name: Upload deployable binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-laserstream-worker-binaries
          path: build-artifacts/go-laserstream-worker
          if-no-files-found: error
          retention-days: 1

  image:
    name: Package immutable Go worker image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Download deployable binaries
        uses: actions/download-artifact@v4
        with:
          name: go-laserstream-worker-binaries
          path: build-artifacts/go-laserstream-worker
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go-laserstream-worker
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            LOYAL_IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=go-laserstream-worker
          cache-to: type=gha,scope=go-laserstream-worker,mode=max
      - name: Probe packaged worker
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE}:sha-${GITHUB_SHA}" -c \
            'test -x /usr/local/bin/loyal-laserstream-worker && test -x /usr/local/bin/earn-domain-bridge'
