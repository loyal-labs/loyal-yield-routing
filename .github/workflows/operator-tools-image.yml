name: operator-tools-image

on:
  pull_request:
    paths:
      - .github/workflows/operator-tools-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.operator-tools
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
  # Keeps main's build cache current so pull requests opened after a merge start
  # from a warm layer set instead of the last manual dispatch. Builds without
  # pushing; see the same note in worker-images.yml.
  push:
    branches:
      - main
    paths:
      - .github/workflows/operator-tools-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.operator-tools
      - rust-toolchain.toml
      - .sqlx/**
      - crates/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: loyal-labs/loyal-yield-routing

jobs:
  build:
    name: Build operator tools image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator-tools
          push: ${{ github.event_name == 'workflow_dispatch' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/operator-tools:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: ${{ github.event_name == 'workflow_dispatch' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=operator-tools
          # Pull requests read main's cache but never write their own; see the
          # same note in worker-images.yml.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=operator-tools,mode=max' || '' }}

      - name: Pull dispatched image for runtime probe
        if: github.event_name == 'workflow_dispatch'
        run: docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAMESPACE}/operator-tools:sha-${GITHUB_SHA}"

      - name: Probe operator image contents and command
        # Cache-warming pushes never load the image locally, so there is nothing
        # to probe.
        if: github.event_name != 'push'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/operator-tools:sha-${{ github.sha }}
          PROBE_BINARIES: >-
            loyal-timescale-migrations fleet-orchestration-verifier
            fleet-orchestration-production-evidence same-mint-monitor-e2e
            route-lookup-table-shared-catalog route-lookup-table-alert-monitor
            route-lookup-table-legacy-import route-lookup-table-cleanup
            signer-balance-monitor
        run: |
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE" | grep -Fx 'linux/amd64'
          docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" | grep -Fx "$GITHUB_SHA"
          docker image inspect "$IMAGE" | jq -e \
            '.[0].Config.Cmd == ["/usr/local/bin/fleet-orchestration-verifier", "--help"]' >/dev/null
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --env PROBE_BINARIES --security-opt=no-new-privileges --entrypoint sh "$IMAGE" -c \
            'for binary in $PROBE_BINARIES; do test -x "/usr/local/bin/$binary"; done'
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges "$IMAGE" >/dev/null
