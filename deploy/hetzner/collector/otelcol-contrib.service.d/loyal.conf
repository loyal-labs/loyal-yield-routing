# Drop-in for the otelcol-contrib package unit
# (/etc/systemd/system/otelcol-contrib.service.d/loyal.conf).
[Service]
ExecStart=
ExecStart=/usr/bin/otelcol-contrib --config=/etc/otelcol-contrib/loyal.yaml
LoadCredentialEncrypted=CLICKSTACK_OTLP_ENDPOINT:/etc/credstore.encrypted/otelcol/CLICKSTACK_OTLP_ENDPOINT
LoadCredentialEncrypted=CLICKSTACK_INGESTION_KEY:/etc/credstore.encrypted/otelcol/CLICKSTACK_INGESTION_KEY
# The journald receiver runs journalctl; it needs the journal group.
SupplementaryGroups=systemd-journal
StateDirectory=otelcol/journald
