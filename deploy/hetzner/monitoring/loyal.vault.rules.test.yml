# Outcome-focused vault paging; no live requests or Telegram messages.
rule_files:
- loyal.rules.yml
evaluation_interval: 1m
tests:
- name: a successful sibling and selector failures cannot conceal a stuck transaction
  interval: 1m
  input_series:
  - series: loyal_family_inflight{family="backyard",unit="loyal-earn-max.service"}
    values: 1x20
  - series: loyal_family_landed_total{family="backyard",unit="loyal-backyard.service"}
    values: 0+1x20
  - series: loyal_family_failed_total{family="backyard",unit="loyal-earn-max.service",code="selector_evaluate_timeout"}
    values: 0+10x20
  alert_rule_test:
  - eval_time: 2m
    alertname: LoyalInflightStuck
    exp_alerts: []
  - eval_time: 5m
    alertname: LoyalInflightStuck
    exp_alerts:
    - exp_labels:
        severity: page
        family: backyard
        unit: loyal-earn-max.service
      exp_annotations:
        summary: backyard has in-flight work without a terminal outcome
        trigger: Work is in flight with no landed/failed outcome in the rolling 3-minute window, sustained for another 3 minutes.
        impact: A transaction may be pending, landed but unreconciled, or awaiting safe expiry handling.
        action: Inspect the persisted operation status, signature, last-valid block height and RPC health. Reconcile landed effects or verify
          finalized expiry and signature absence before replacing work. Keep ambiguous reservations; never blindly resend.
        recovery: Confirm a journaled terminal outcome backed by chain evidence. A drop in the in-flight gauge alone is not proof of payment or
          safe retry.
  - eval_time: 20m
    alertname: LoyalFamilyFailing
    exp_alerts: []
- name: cashflows keep per-share value stable and a brief high quote is not a baseline
  interval: 1m
  input_series:
  - series: loyal_backyard_net_value_per_share{vault="rwa",unit="loyal-earn-max.service"}
    values: 1x10 1.1 1x15
  - series: loyal_backyard_share_supply_raw{vault="rwa",unit="loyal-earn-max.service"}
    values: 100x5 200x5 50x16
  alert_rule_test:
  - eval_time: 15m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
  - eval_time: 25m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
- name: a first-scrape price spike cannot establish the loss baseline
  interval: 1m
  input_series:
  - series: loyal_backyard_net_value_per_share{vault="rwa",unit="loyal-earn-max.service"}
    values: 1.1 1x30
  - series: loyal_backyard_share_supply_raw{vault="rwa",unit="loyal-earn-max.service"}
    values: 100x31
  alert_rule_test:
  - eval_time: 6m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
  - eval_time: 30m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
- name: a sustained holder loss pages and survives missing observations until explicitly drained
  interval: 1m
  input_series:
  - series: loyal_backyard_net_value_per_share{vault="rwa",unit="loyal-earn-max.service"}
    values: 1x10 0.997x5 stale _x20
  - series: loyal_backyard_share_supply_raw{vault="rwa",unit="loyal-earn-max.service"}
    values: 100x15 stale _x9 0x10
  alert_rule_test:
  - eval_time: 13m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
  - eval_time: 15m
    alertname: LoyalBackyardValueFalling
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Estimated holder value per share has fallen
        trigger: Certified value per share is more than 0.2% below a sustained five-minute value in the previous six hours, for 3 minutes.
        impact: Holders may be losing value through execution costs, market moves or fees. Normal proportional deposits and withdrawals do not
          cause this signal; it is not proof of realized loss.
        action: Compare the first decline with reconciled sales, debt credits, fees and collateral prices. Check whether further costly operations
          are planned and investigate their cause.
        recovery: Verify fresh per-share observations are stable and the cause is addressed. Leaving the comparison window does not recover earlier
          losses.
  - eval_time: 24m
    alertname: LoyalBackyardValueFalling
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Estimated holder value per share has fallen
        trigger: Certified value per share is more than 0.2% below a sustained five-minute value in the previous six hours, for 3 minutes.
        impact: Holders may be losing value through execution costs, market moves or fees. Normal proportional deposits and withdrawals do not
          cause this signal; it is not proof of realized loss.
        action: Compare the first decline with reconciled sales, debt credits, fees and collateral prices. Check whether further costly operations
          are planned and investigate their cause.
        recovery: Verify fresh per-share observations are stable and the cause is addressed. Leaving the comparison window does not recover earlier
          losses.
  - eval_time: 27m
    alertname: LoyalBackyardValueFalling
    exp_alerts: []
- name: manual recovery persists through a scrape gap and only an explicit clear resolves it
  interval: 1m
  input_series:
  - series: loyal_backyard_recovery_required{vault="rwa",unit="loyal-earn-max.service"}
    values: 1x3 stale _x5 0x10
  - series: loyal_backyard_recovery_required{vault="looping",unit="loyal-backyard.service"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 0m
    alertname: LoyalBackyardRecoveryRequired
    exp_alerts: []
  - eval_time: 2m
    alertname: LoyalBackyardRecoveryRequired
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Vault management is paused for operator recovery
        trigger: The persisted manual-recovery latch has remained active for 1 minute.
        impact: The worker has stopped managing the vault, including automatic protection of any outstanding loans.
        action: Read the recovery reason and operation journal, reconcile chain effects, and resolve the underlying fault before clearing the
          latch.
        recovery: Verify the latch was explicitly cleared after safe reconciliation and fresh vault management resumed.
  - eval_time: 8m
    alertname: LoyalBackyardRecoveryRequired
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Vault management is paused for operator recovery
        trigger: The persisted manual-recovery latch has remained active for 1 minute.
        impact: The worker has stopped managing the vault, including automatic protection of any outstanding loans.
        action: Read the recovery reason and operation journal, reconcile chain effects, and resolve the underlying fault before clearing the
          latch.
        recovery: Verify the latch was explicitly cleared after safe reconciliation and fresh vault management resumed.
  - eval_time: 11m
    alertname: LoyalBackyardRecoveryRequired
    exp_alerts: []
- name: a fresh healthy process cannot hide missing holder valuation
  interval: 1m
  input_series:
  - series: up{job="loyal",unit="loyal-earn-max.service"}
    values: 1x20
  alert_rule_test:
  - eval_time: 4m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts: []
  - eval_time: 6m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts:
    - exp_labels:
        severity: page
        job: loyal
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Current holder value cannot be established
        trigger: No coherent certified valuation for over 10 minutes, sustained for 5 minutes; a worker that never publishes one alerts after
          5 minutes.
        impact: The loss detector cannot establish current holder value. A healthy process or an old NAV report does not establish that funds
          are safe.
        action: Check missing or expired exit quotes, reserve observations and NAV evidence. Restore a coherent valuation; do not substitute zero
          or an old report for missing value.
        recovery: Verify the certified valuation timestamp advances from fresh evidence and review the first new per-share value.
- name: a previously valued vault pages on stale evidence and clears after a fresh valuation
  interval: 1m
  input_series:
  - series: loyal_backyard_valued_timestamp_seconds{vault="rwa",unit="loyal-earn-max.service"}
    values: 0x19 1200+60x10
  alert_rule_test:
  - eval_time: 15m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts: []
  - eval_time: 16m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Current holder value cannot be established
        trigger: No coherent certified valuation for over 10 minutes, sustained for 5 minutes; a worker that never publishes one alerts after
          5 minutes.
        impact: The loss detector cannot establish current holder value. A healthy process or an old NAV report does not establish that funds
          are safe.
        action: Check missing or expired exit quotes, reserve observations and NAV evidence. Restore a coherent valuation; do not substitute zero
          or an old report for missing value.
        recovery: Verify the certified valuation timestamp advances from fresh evidence and review the first new per-share value.
  - eval_time: 21m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts: []
- name: fresh coherent valuations remain quiet
  interval: 1m
  input_series:
  - series: loyal_backyard_valued_timestamp_seconds{vault="rwa",unit="loyal-earn-max.service"}
    values: 0+60x30
  alert_rule_test:
  - eval_time: 30m
    alertname: LoyalBackyardValuationUnavailable
    exp_alerts: []
- name: unsafe debt remains visible through a restart and explicit repayment clears it
  interval: 1m
  input_series:
  - series: loyal_backyard_safety_ltv_margin_bps{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: -10x3 stale _x15
  - series: loyal_backyard_liquidation_margin_bps{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: -1x3 stale _x15
  - series: loyal_backyard_lane_has_debt{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: 1x3 stale _x5 0x10
  alert_rule_test:
  - eval_time: 1m
    alertname: LoyalBackyardDebtSafetyRisk
    exp_alerts: []
  - eval_time: 3m
    alertname: LoyalBackyardDebtSafetyRisk
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Automatic debt reduction has not restored the safety margin on AUTO/AUTO/wYLDS
        trigger: The last observed LTV remains at or above the worker safety threshold for 2 minutes while debt is outstanding.
        impact: The position is closer to liquidation than the configured safety margin permits.
        action: Inspect current LTV, debt, collateral prices and the repayment operation. Check why automatic reduction is not landing; verify
          signatures before any intervention.
        recovery: Verify a fresh observation below the safety threshold or explicitly repaid debt. A missing lane series is not evidence of safety.
  - eval_time: 0m
    alertname: LoyalBackyardLiquidatable
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Loan has reached its liquidation threshold on AUTO/AUTO/wYLDS
        trigger: The last coherent observation has LTV at or above the liquidation threshold and still shows outstanding debt.
        impact: Collateral can be liquidated and holders can lose money now.
        action: Immediately inspect confirmed debt and collateral, current prices and in-flight protective repayments. Coordinate recovery without
          duplicating a signed transaction.
        recovery: Verify confirmed debt repayment or a restored liquidation margin from fresh evidence. Missing telemetry does not clear the known
          exposure.
  - eval_time: 8m
    alertname: LoyalBackyardLiquidatable
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Loan has reached its liquidation threshold on AUTO/AUTO/wYLDS
        trigger: The last coherent observation has LTV at or above the liquidation threshold and still shows outstanding debt.
        impact: Collateral can be liquidated and holders can lose money now.
        action: Immediately inspect confirmed debt and collateral, current prices and in-flight protective repayments. Coordinate recovery without
          duplicating a signed transaction.
        recovery: Verify confirmed debt repayment or a restored liquidation margin from fresh evidence. Missing telemetry does not clear the known
          exposure.
  - eval_time: 11m
    alertname: LoyalBackyardDebtSafetyRisk
    exp_alerts: []
  - eval_time: 11m
    alertname: LoyalBackyardLiquidatable
    exp_alerts: []
- name: unknown loan risk cannot be concealed by a healthy sibling lane
  interval: 1m
  input_series:
  - series: loyal_backyard_risk_observed_timestamp_seconds{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: '0x20'
  - series: loyal_backyard_lane_has_debt{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: 1x14 0x10
  - series: loyal_backyard_risk_observed_timestamp_seconds{vault="rwa",unit="loyal-earn-max.service",lane="healthy"}
    values: 0+60x30
  - series: loyal_backyard_lane_has_debt{vault="rwa",unit="loyal-earn-max.service",lane="healthy"}
    values: 1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: LoyalBackyardDebtRiskUnknown
    exp_alerts: []
  - eval_time: 11m
    alertname: LoyalBackyardDebtRiskUnknown
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Loan risk cannot be refreshed on AUTO/AUTO/wYLDS
        trigger: An outstanding loan has had no coherent debt and LTV observation for over 5 minutes, sustained for 5 minutes.
        impact: Automatic protection is operating without a current view of this loan; the last healthy LTV may no longer apply.
        action: Restore reserve and obligation observations and check the current position directly. Confirm the protection loop resumes with
          fresh chain evidence.
        recovery: Verify a fresh risk observation or an explicit observation of zero debt; disappearing metrics do not prove recovery.
  - eval_time: 16m
    alertname: LoyalBackyardDebtRiskUnknown
    exp_alerts: []
- name: automatic repayment gets fifteen minutes inside its one-day window
  interval: 1m
  input_series:
  - series: loyal_backyard_term_debt_days_to_maturity{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: 0.9x20 30x10
  - series: loyal_backyard_lane_has_debt{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: 1x30
  alert_rule_test:
  - eval_time: 14m
    alertname: LoyalBackyardTermDebtNearMaturity
    exp_alerts: []
  - eval_time: 16m
    alertname: LoyalBackyardTermDebtNearMaturity
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Term-loan repayment is overdue on AUTO/AUTO/wYLDS
        trigger: Debt remains under 24 hours from maturity for 15 minutes, after automatic repayment becomes due when renewal is unavailable.
        impact: The automatic safety action has not cleared the debt. At maturity the loan becomes eligible for liquidation.
        action: Check whether renewal or debt repayment is landing, the current debt balance and any blocked safety step. Verify in-flight signatures
          before intervening; do not manually roll the loan.
        recovery: Verify a fresh observation proving zero debt or a renewed maturity. Missing telemetry is not repayment.
  - eval_time: 22m
    alertname: LoyalBackyardTermDebtNearMaturity
    exp_alerts: []
- name: matured debt pages immediately and explicit zero debt clears the historical maturity
  interval: 1m
  input_series:
  - series: loyal_backyard_term_debt_days_to_maturity{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: -0.1x30
  - series: loyal_backyard_lane_has_debt{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS"}
    values: 1x19 0x10
  alert_rule_test:
  - eval_time: 0m
    alertname: LoyalBackyardTermDebtExpired
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Unpaid term loan has matured on AUTO/AUTO/wYLDS
        trigger: The observed term has expired and the lane still has outstanding debt.
        impact: The debt is eligible for maturity-based liquidation even if its price-based LTV looks healthy.
        action: Immediately inspect the confirmed debt, repayment attempts and blocked safety action. Reconcile any in-flight signature before
          taking recovery action.
        recovery: Verify fresh evidence of zero debt or an on-chain renewed maturity. Missing telemetry is not repayment.
  - eval_time: 16m
    alertname: LoyalBackyardTermDebtNearMaturity
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
      exp_annotations:
        summary: Term-loan repayment is overdue on AUTO/AUTO/wYLDS
        trigger: Debt remains under 24 hours from maturity for 15 minutes, after automatic repayment becomes due when renewal is unavailable.
        impact: The automatic safety action has not cleared the debt. At maturity the loan becomes eligible for liquidation.
        action: Check whether renewal or debt repayment is landing, the current debt balance and any blocked safety step. Verify in-flight signatures
          before intervening; do not manually roll the loan.
        recovery: Verify a fresh observation proving zero debt or a renewed maturity. Missing telemetry is not repayment.
  - eval_time: 21m
    alertname: LoyalBackyardTermDebtExpired
    exp_alerts: []
  - eval_time: 21m
    alertname: LoyalBackyardTermDebtNearMaturity
    exp_alerts: []
- name: a stopped expected vault pages while the sibling remains healthy
  interval: 1m
  input_series:
  - series: up{job="loyal",unit="loyal-earn-max.service"}
    values: '0x10'
  - series: up{job="loyal",unit="loyal-backyard.service"}
    values: 1x10
  alert_rule_test:
  - eval_time: 1m
    alertname: LoyalVaultUnavailable
    exp_alerts: []
  - eval_time: 3m
    alertname: LoyalVaultUnavailable
    exp_alerts:
    - exp_labels:
        severity: page
        job: loyal
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Vault worker is unavailable
        trigger: An expected vault worker has no successful metrics scrape for 2 minutes, including a stopped service or missing scrape target.
        impact: Deposits, withdrawals and automatic loan protection may no longer be managed.
        action: Check the named service, its expected release and first failure. Inspect unresolved signed operations before restarting; restore
          fresh vault observations.
        recovery: Verify fresh observations and successful vault work after the service returns; a metrics endpoint alone is not sufficient.
- name: deleting an expected scrape target is not recovery
  interval: 1m
  input_series:
  - series: up{job="loyal",unit="loyal-backyard.service"}
    values: 1x10
  alert_rule_test:
  - eval_time: 3m
    alertname: LoyalVaultUnavailable
    exp_alerts:
    - exp_labels:
        severity: page
        job: loyal
        unit: loyal-earn-max.service
      exp_annotations:
        summary: Vault worker is unavailable
        trigger: An expected vault worker has no successful metrics scrape for 2 minutes, including a stopped service or missing scrape target.
        impact: Deposits, withdrawals and automatic loan protection may no longer be managed.
        action: Check the named service, its expected release and first failure. Inspect unresolved signed operations before restarting; restore
          fresh vault observations.
        recovery: Verify fresh observations and successful vault work after the service returns; a metrics endpoint alone is not sufficient.
- name: current no-room clears promptly when a safety operation resumes
  interval: 1m
  input_series:
  - series: loyal_backyard_step_no_room_total{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS",rule="hard_ltv"}
    values: 0+1x10
  - series: loyal_backyard_hold{vault="rwa",unit="loyal-earn-max.service",lane="AUTO/AUTO/wYLDS",reason="no_room"}
    values: 1x4 0x10
  alert_rule_test:
  - eval_time: 4m
    alertname: LoyalBackyardSafetyStepNoRoom
    exp_alerts:
    - exp_labels:
        severity: page
        vault: rwa
        unit: loyal-earn-max.service
        lane: AUTO/AUTO/wYLDS
        rule: hard_ltv
      exp_annotations:
        summary: A required loan-safety action is blocked on AUTO/AUTO/wYLDS
        trigger: A hard-LTV or maturity repayment encountered insufficient room and the lane remains held for that reason for 2 minutes.
        impact: Automatic debt reduction cannot protect the position while the liquidity or collateral constraint persists.
        action: Inspect the current no_room cause, debt balance and executable repayment path. Check any in-flight signature; do not raise risk
          limits or bypass the guard.
        recovery: Confirm the safety action landed or a fresh decision no longer requires it. Historical failure counters alone do not keep this
          alert open.
  - eval_time: 6m
    alertname: LoyalBackyardSafetyStepNoRoom
    exp_alerts: []
