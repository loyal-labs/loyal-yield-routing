    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: The unmoved-funds scan could not read 2 relay_signed EVM wallets
        trigger: The last scan failed to read at least one relay_signed EVM wallet from Privy; condition persisted for 1 hour.
        impact: Funds left unmoved on those wallets go unnoticed while the reads fail, and their last known series stays as it was.
        action: Read the retail engine's 'bridge incoming scan incomplete' warning for the error and Privy status. Check Privy rate limits and that the address still exists as an Ethereum wallet in the Privy app.
        recovery: Confirm the failed-addresses gauge is back to 0 on the next scan.
