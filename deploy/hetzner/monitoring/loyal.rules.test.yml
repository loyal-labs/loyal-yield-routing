- name: bridge_incoming_scan_stale_is_silent_on_a_fresh_rollout_and_pages_35m_after_the_last_success
  interval: 1m
  input_series:
  - series: loyal_bridge_incoming_scan_last_success_timestamp_seconds
    values: '0x9 600x60'
  alert_rule_test:
  - eval_time: 44m
    alertname: LoyalBridgeIncomingScanStale
  - eval_time: 49m
    alertname: LoyalBridgeIncomingScanStale
    exp_alerts:
    - exp_labels:
        severity: page
      exp_annotations:
        summary: The unmoved-funds scan has not completed for 35m
        trigger: No scan read the relay_signed routes from the database for over 35 minutes (three scan intervals plus a tick of slack); condition persisted for 2 minutes.
        impact: Funds left unmoved on a user's EVM wallet would go unnoticed.
        action: Check the retail engine is running, that privy-gas-spend.conf credentials are installed on the retail unit and the role has SELECT on loyal_yield.evm_deposit_routes. Read the retail engine's 'bridge incoming scan failed' error.
        recovery: Confirm the last-success timestamp advances every 10 minutes. A vanished series is not proof of recovery.
