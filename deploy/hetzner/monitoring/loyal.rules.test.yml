- name: sponsor_refusals_page_from_the_third_in_fifteen_minutes
  interval: 1m
  input_series:
  - series: loyal_bridge_sponsor_refusals_total{chain="base"}
    values: 0x20 1 2 2x10
  - series: loyal_bridge_sponsor_refusals_total{chain="polygon"}
    values: 0x20 1 2 3 3x10
  alert_rule_test:
  - eval_time: 22m
    alertname: LoyalBridgeSponsorRefused
  - eval_time: 25m
    alertname: LoyalBridgeSponsorRefused
    exp_alerts:
    - exp_labels:
        alertname: LoyalBridgeSponsorRefused
        chain: polygon
        severity: page
      exp_annotations:
        summary: Privy refused to sponsor Move sends on polygon
        trigger: Signed-in users' Moves from their EVM wallets to Solana reported at least 3 gas sponsorship refusals from Privy in the last 15 minutes.
        impact: Users cannot move funds from that chain to Solana; the funds stay in their EVM wallet until sponsorship works again.
        action: Read loyal-web's 'bridge sponsored send refused' log lines for Privy's message. Check the Privy dashboard under Billing > Fee sponsorship for the credit balance and that the chain is enabled in the sponsorship policy.
        recovery: Confirm a fresh Move on that chain sends without a refusal and the counter stops increasing; the window expiring is not a fix.
- name: db_replica_subscription_down_pages_after_five_minutes
  interval: 1m
  input_series:
  - series: loyal_db_subscription_worker_up{subscription="loyal_hz_app"}
    values: '1x10 0x30'
  - series: loyal_db_subscription_worker_up{subscription="loyal_hz_yield"}
    values: '1x40'
  alert_rule_test:
  - eval_time: 14m
    alertname: LoyalDbReplicaSubscriptionDown
  - eval_time: 16m
    alertname: LoyalDbReplicaSubscriptionDown
    exp_alerts:
    - exp_labels:
        severity: page
        subscription: loyal_hz_app
      exp_annotations:
        summary: Replica subscription loyal_hz_app has no apply worker
        trigger: The subscription has had no running apply worker on loyal-db-primary for 5 minutes. It is disabled, dropped or crashing.
        impact: The Hetzner copy stops following Neon. Neon drops an inactive slot after about 40 hours and the database must then be copied again.
        action: On loyal-db-primary run `loyal-db-replica verify`, then read the postgresql@18-main log for the apply error. A disabled subscription is resumed with ALTER SUBSCRIPTION ... ENABLE. Do not drop it.
        recovery: Verify the apply worker is back (`loyal-db-replica verify` shows a fresh last_msg) and the slot lag is falling to 0.
- name: db_replica_subscription_stale_pages_after_fifteen_minutes_without_a_message
  interval: 1m
  input_series:
  - series: loyal_db_subscription_last_msg_receipt_timestamp_seconds{subscription="loyal_hz_app"}
    values: '0x40'
  - series: loyal_db_subscription_last_msg_receipt_timestamp_seconds{subscription="loyal_hz_yield"}
    values: '0+60x40'
  alert_rule_test:
  - eval_time: 15m
    alertname: LoyalDbReplicaSubscriptionStale
  - eval_time: 17m
    alertname: LoyalDbReplicaSubscriptionStale
    exp_alerts:
    - exp_labels:
        severity: page
        subscription: loyal_hz_app
      exp_annotations:
        summary: Replica subscription loyal_hz_app has received nothing for 15m
        trigger: pg_stat_subscription.last_msg_receipt_time is more than 15 minutes old. A healthy walsender sends a keepalive at least every minute.
        impact: The apply worker is attached but not receiving from Neon, so the replica falls behind and the slot pins WAL on Neon.
        action: On loyal-db-primary run `loyal-db-replica verify` and read the postgresql@18-main log for connection or apply errors. Check Neon status and that the Neon compute is awake.
        recovery: Verify last_msg in `loyal-db-replica verify` is seconds old and stays so.
- name: db_neon_slot_inactive_pages_after_ten_minutes
  interval: 1m
  input_series:
  - series: loyal_db_neon_slot_active{slot="loyal_hz_timescale"}
    values: '1x5 0x30'
  - series: loyal_db_neon_slot_active{slot="loyal_hz_app"}
    values: '1x40'
  alert_rule_test:
  - eval_time: 14m
    alertname: LoyalDbNeonSlotInactive
  - eval_time: 16m
    alertname: LoyalDbNeonSlotInactive
    exp_alerts:
    - exp_labels:
        severity: page
        slot: loyal_hz_timescale
      exp_annotations:
        summary: Neon slot loyal_hz_timescale is inactive
        trigger: Neon reports the replication slot has no connected consumer for 10 minutes.
        impact: Neon removes an inactive slot after about 40 hours. Until then it pins WAL and grows Neon storage; after that the database must be copied again.
        action: Find why the subscription is not connected (`loyal-db-replica verify`, apply worker, Neon reachability) and fix it within hours, not days.
        recovery: Verify the slot is active=true in `loyal-db-replica verify` and its lag is falling.
- name: db_neon_slot_lag_pages_above_five_gib_for_ten_minutes
  interval: 1m
  input_series:
  - series: loyal_db_neon_slot_lag_bytes{slot="loyal_hz_yield"}
    values: '0x5 6442450944x30'
  - series: loyal_db_neon_slot_lag_bytes{slot="loyal_hz_app"}
    values: '5368709120x40'
  alert_rule_test:
  - eval_time: 14m
    alertname: LoyalDbNeonSlotLag
  - eval_time: 16m
    alertname: LoyalDbNeonSlotLag
    exp_alerts:
    - exp_labels:
        severity: page
        slot: loyal_hz_yield
      exp_annotations:
        summary: Neon slot loyal_hz_yield lags by 6GiB
        trigger: confirmed_flush_lsn trails the Neon write position by more than 5 GiB for 10 minutes.
        impact: The replica is far behind and the slot pins that much WAL on Neon storage.
        action: Check whether the apply worker is running, the box disk is full, or a large write is in flight (`loyal-db-replica verify`). Do not drop the slot.
        recovery: Verify the lag is below 5 GiB and falling.
- name: db_neon_probe_failing_pages_after_fifteen_minutes
  interval: 1m
  input_series:
  - series: loyal_db_neon_probe_success{source="app"}
    values: '1x5 0x40'
  - series: loyal_db_neon_probe_success{source="yield"}
    values: '1x45'
  alert_rule_test:
  - eval_time: 19m
    alertname: LoyalDbNeonProbeFailing
  - eval_time: 21m
    alertname: LoyalDbNeonProbeFailing
    exp_alerts:
    - exp_labels:
        severity: page
        source: app
      exp_annotations:
        summary: Cannot read the Neon app slot from loyal-db-primary
        trigger: The slot query against Neon failed on every run for 15 minutes.
        impact: Slot activity and lag for that source are unknown, so the slot alerts cannot fire.
        action: On loyal-db-primary run `loyal-db-replica check`. Check Neon status, the Neon URL in /etc/loyal-db/replica and that the compute accepts connections.
        recovery: Verify the metrics file shows loyal_db_neon_probe_success 1 for that source.
- name: db_volume_low_pages_below_one_hundred_gib
  interval: 1m
  input_series:
  - series: node_filesystem_avail_bytes{mountpoint="/srv/postgresql",instance="10.92.1.1:9100",job="node"}
    values: '171346620416x5 99999999999x30'
  - series: node_filesystem_avail_bytes{mountpoint="/",instance="10.92.1.2:9100",job="node"}
    values: '1000x40'
  alert_rule_test:
  - eval_time: 9m
    alertname: LoyalDbVolumeLow
  - eval_time: 11m
    alertname: LoyalDbVolumeLow
    exp_alerts:
    - exp_labels:
        severity: page
        mountpoint: /srv/postgresql
        instance: 10.92.1.1:9100
        job: node
      exp_annotations:
        summary: loyal-db-primary data volume has 93.13GiB free
        trigger: Free space on /srv/postgresql stayed below 100 GiB for 5 minutes.
        impact: Postgres stops when the volume is full, which also stops the replica.
        action: Look at pg_wal and the archive backlog first (`loyal-db-replica verify`), then the largest relations. Free space before the volume fills; do not delete WAL files by hand.
        recovery: Verify free space is above 100 GiB and not falling.
- name: db_wal_large_pages_above_sixty_gb
  interval: 1m
  input_series:
  - series: loyal_db_pg_wal_bytes
    values: '8438940025x5 61000000000x30'
  alert_rule_test:
  - eval_time: 9m
    alertname: LoyalDbWalLarge
  - eval_time: 11m
    alertname: LoyalDbWalLarge
    exp_alerts:
    - exp_labels:
        severity: page
      exp_annotations:
        summary: loyal-db-primary pg_wal is 56.81GiB
        trigger: pg_wal stayed above 60 GB for 5 minutes.
        impact: WAL is not being archived or a slot holds it, and the volume fills.
        action: Check the pgbackrest archive backlog and Storage Box reachability, and any stalled replication slot (`loyal-db-replica verify`).
        recovery: Verify pg_wal is back below 60 GB and shrinking.
- name: db_replica_metrics_stale_pages_when_the_timer_stops
  interval: 1m
  input_series:
  - series: loyal_db_replica_metrics_last_success_timestamp_seconds
    values: '0+60x5 300x40'
  alert_rule_test:
  - eval_time: 14m
    alertname: LoyalDbReplicaMetricsStale
  - eval_time: 22m
    alertname: LoyalDbReplicaMetricsStale
    exp_alerts:
    - exp_labels:
        severity: page
      exp_annotations:
        summary: Replica health metrics from loyal-db-primary are not updating
        trigger: The loyal-db-replica-metrics timer has not completed a run for 10 minutes, or the series is gone.
        impact: Every replica alert above is blind, so a stopped subscription would go unnoticed.
        action: On loyal-db-primary run `systemctl status loyal-db-replica-metrics.service` and `journalctl -u loyal-db-replica-metrics`. Check node_exporter is scraped (LoyalMonitoringDown for job node).
        recovery: Verify the last-success timestamp advances every minute.
- name: bridge_incoming_unmoved_survives_an_engine_restart_gap
  interval: 1m
  input_series:
  - series: loyal_bridge_incoming_unmoved{address="0xbd03e1f47c2a9b6d0e53f8a14c7d26b9d5c48179",chain="ethereum",asset="usdt",under_min="false"}
    values: '25x19 _x10 25x40'
  alert_rule_test:
  - eval_time: 25m
    alertname: LoyalBridgeIncomingUnmoved
  - eval_time: 32m
    alertname: LoyalBridgeIncomingUnmoved
    exp_alerts:
    - exp_labels:
        severity: page
        address: 0xbd03e1f47c2a9b6d0e53f8a14c7d26b9d5c48179
        chain: ethereum
        asset: usdt
      exp_annotations:
        summary: 25 usdt left unmoved on 0xbd03e1f47c2a9b6d0e53f8a14c7d26b9d5c48179 (ethereum)
        trigger: A relay_signed EVM wallet held at least 0.1 units of a token with no inbound transfer confirmed for its wallet in the last 30 minutes, and the balance stayed for 30 minutes.
        impact: A user's funds sit on their EVM wallet and never reach their Solana balance until the user moves them or support does.
        action: Read the retail engine's 'bridge incoming unmoved' log line for this address. The user must press Confirm on Assets to move it, or support moves or refunds it.
        recovery: Confirm the next scan reads the address and its series is gone; a stale series does not prove recovery.
