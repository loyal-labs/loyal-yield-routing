        asset: usdt
      exp_annotations:
        summary: 5 usdt on 0xbd03e1f47c2a9b6d0e53f8a14c7d26b9d5c48179 (ethereum) is under the chain minimum and cannot be moved
        trigger: A relay_signed EVM wallet held at least 0.1 units of a token below its chain's minimum for 30 minutes with no inbound transfer confirmed for its wallet.
        impact: The balance is too small for the Move screen to bridge, so it stays on the EVM wallet until support acts.
        action: The UI cannot move an amount under the chain minimum. Support refunds it or the user tops it up to the minimum; read the 'bridge incoming unmoved' log line with under_min=true for the amount.
