- name: a NAV report older than 3 hours pages while a fresh one does not
  interval: 1m
  input_series:
  - series: loyal_backyard_nav_reported_timestamp_seconds{family="backyard",route="pooled-usdc"}
    values: '0x240'
  - series: loyal_backyard_nav_reported_timestamp_seconds{family="backyard",route="fresh"}
    values: 0+60x240
  alert_rule_test:
  - eval_time: 185m
    alertname: LoyalBackyardNAVReportStale
  - eval_time: 187m
    alertname: LoyalBackyardNAVReportStale
    exp_alerts:
    - exp_labels:
        severity: page
        family: backyard
        route: pooled-usdc
      exp_annotations:
        action: Read the route's latest REPORT_NAV operation and any manual-recovery latch or held decision that stops reports. Check RPC and database health, then verify the next report reconciles on chain; do not clear a latch or force a report just to silence the alert.
        impact: The vault's reported NAV is stale, so deposits and withdrawals may be priced from an old value.
        recovery: Verify a new REPORT_NAV reconciled and the exported report time advanced. A vanished series is not proof that reports resumed.
        summary: Earn MAX NAV report is overdue
        trigger: A vault that holds value has had no NAV report land in over 3 hours (routine cadence is hourly), or no report time is exported at all; condition persisted for 5 minutes.
