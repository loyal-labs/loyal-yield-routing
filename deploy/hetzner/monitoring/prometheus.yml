# Prometheus on the worker host. Everything listens on loopback only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/loyal.rules.yml
  # xstock.rules.yml, owned by the xstock-bot repo (deploy/xstock.rules.yml).
  # A glob, so the config loads before that file is installed.
  - /etc/prometheus/xstock*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # The Go workers' /metrics. A unit that is not running is not scraped
  # successfully; LoyalWorkerDown pages only when systemd says it should be.
  - job_name: loyal
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels: {unit: loyal-observer.service}
      - targets: ["127.0.0.1:9102"]
        labels: {unit: loyal-retail.service}
      - targets: ["127.0.0.1:9103"]
        labels: {unit: loyal-backyard.service}

  # xstock-bot (its own repo, same host): the bot and its pools recorder.
  - job_name: xstock
    static_configs:
      - targets: ["127.0.0.1:9111"]
        labels: {unit: xstock-bot.service}
      - targets: ["127.0.0.1:9112"]
        labels: {unit: xstock-pools.service}

  # node_exporter with the systemd collector: unit state and restart counts
  # for every loyal-* and xstock-* unit.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # The monitoring stack itself; Watchdog covers the case where it is all down.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
