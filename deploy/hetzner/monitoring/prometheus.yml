# Prometheus on the worker host. Everything listens on loopback only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/loyal.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # The Go workers' /metrics. A unit that is not running is not scraped
  # successfully; LoyalWorkerDown pages only when systemd says it should be.
  - job_name: loyal
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels: {unit: loyal-observer.service}
      - targets: ["127.0.0.1:9102"]
        labels: {unit: loyal-retail.service}
      - targets: ["127.0.0.1:9103"]
        labels: {unit: loyal-backyard.service}

  # node_exporter with the systemd collector: unit state and restart counts
  # for every loyal-* unit, Go and Rust alike.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # The monitoring stack itself; Watchdog covers the case where it is all down.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
