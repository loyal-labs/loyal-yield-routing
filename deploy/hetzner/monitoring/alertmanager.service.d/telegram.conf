# Drop-in for the distribution's Alertmanager unit
# (/etc/systemd/system/prometheus-alertmanager.service.d/telegram.conf).
[Service]
LoadCredentialEncrypted=telegram_bot_token:/etc/credstore.encrypted/alertmanager/telegram_bot_token
LoadCredentialEncrypted=heartbeat_url:/etc/credstore.encrypted/alertmanager/heartbeat_url
