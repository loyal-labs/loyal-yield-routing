# Alertmanager with its native Telegram receiver. The bot token and the
# heartbeat URL are systemd credentials (alertmanager.service.d/); the chat
# id below is a placeholder the operator replaces at install time.
route:
  receiver: telegram
  # Keep distinct causes/resources in separate bounded Telegram messages.
  group_by: [alertname, family, route, code, vault, lane, name, unit, job, instance, payer]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The always-firing Watchdog pings an external dead man's switch, which
    # pages on its own when the pings stop.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # One address per message: many held addresses in one group would pass
    # Telegram's 4096-character limit.
    - matchers: [alertname=~"LoyalBridgeIncoming(Unmoved|Stranded)"]
      group_by: [alertname, address, chain, asset]
    # xstock-bot is the owner's own trading bot, not Loyal's: its alerts stay
    # out of the Loyal alerts chat.
    - matchers: [family="xstock"]
      receiver: xstock
    # Vault opportunity warnings remain available in Prometheus. Telegram
    # carries holder impact and intervention, not recoverable attempt counts.
    - matchers: [severity="warning", unit=~"loyal-(backyard|earn-max)\\.service"]
      receiver: diagnostics
    - matchers: [severity="warning", family="backyard"]
      receiver: diagnostics
    - matchers: [alertname="LoyalFamilyFailing", family="backyard"]
      receiver: diagnostics

inhibit_rules:
  # A unit that is down explains its own stale families and missing metrics.
  - source_matchers: [alertname="LoyalWorkerDown"]
    target_matchers: [alertname=~"LoyalFamilyProgressStale|LoyalInflightStuck"]
    equal: [unit]
  # An exhausted fee payer is why Autodeposit starts nothing: one page.
  - source_matchers: [alertname="LoyalFeePayerExhausted"]
    target_matchers: [alertname="LoyalFamilyProgressStale", family="autodeposit"]
    equal: [unit]
  - source_matchers: [alertname="LoyalVaultUnavailable"]
    target_matchers: [alertname=~"LoyalFamilyProgressStale|LoyalInflightStuck|LoyalUnitDown|LoyalUnitRestartLoop|LoyalBackyardValuationUnavailable|LoyalBackyardDebtRiskUnknown|LoyalBackyardWithdrawalHealthUnavailable|LoyalBackyardNAVReportStale"]
    equal: [unit]
  - source_matchers: [alertname="LoyalBackyardRecoveryRequired"]
    target_matchers: [alertname=~"LoyalFamilyProgressStale|LoyalBackyardValuationUnavailable|LoyalBackyardDebtRiskUnknown"]
    equal: [unit]
  - source_matchers: [alertname="LoyalBackyardLiquidatable"]
    target_matchers: [alertname=~"LoyalBackyardDebtSafetyRisk|LoyalBackyardSafetyStepNoRoom"]
    equal: [unit, vault, lane]
  - source_matchers: [alertname="LoyalBackyardTermDebtExpired"]
    target_matchers: [alertname="LoyalBackyardTermDebtNearMaturity"]
    equal: [unit, vault, lane]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/credentials/prometheus-alertmanager.service/telegram_bot_token
        chat_id: -1000000000000 # placeholder: the alerts chat id
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ range .Alerts }}<b>{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }} · {{ .Labels.severity | html }} · {{ if or (eq .Labels.vault "rwa") (eq .Labels.unit "loyal-earn-max.service") (eq .Labels.name "loyal-earn-max.service") }}Loyal Earn MAX vault{{ else if or (eq .Labels.vault "looping") (eq .Labels.unit "loyal-backyard.service") (eq .Labels.name "loyal-backyard.service") }}Backyard vault{{ else if eq .Labels.family "backyard" }}Vault management{{ else if .Labels.family }}{{ .Labels.family | html }}{{ else }}Worker infrastructure{{ end }}</b>
          <b>{{ .Annotations.summary | html }}</b>
          Rule: {{ .Labels.alertname | html }}{{ if .Labels.code }} · Code: {{ .Labels.code | html }}{{ end }}
          {{ if .Labels.unit }}Service: {{ .Labels.unit | html }}{{ else if .Labels.name }}Service: {{ .Labels.name | html }}{{ end }}{{ if .Labels.job }} · Component: {{ .Labels.job | html }}{{ end }}{{ if .Labels.lane }} · Lane: {{ .Labels.lane | html }}{{ end }}{{ if .Labels.route }} · Route: {{ .Labels.route | html }}{{ end }}{{ if .Labels.payer }} · Payer: {{ .Labels.payer | html }}{{ end }}
          {{ if eq .Status "firing" }}Signal: {{ if .Annotations.trigger }}{{ .Annotations.trigger | html }}{{ else }}No trigger description was supplied; inspect this rule before interpreting the condition.{{ end }}
          Impact: {{ if .Annotations.impact }}{{ .Annotations.impact | html }}{{ else }}Impact is unclassified. Identify the affected component from the rule and context above; do not infer transaction failure or payment.{{ end }}
          Next: {{ if .Annotations.action }}{{ .Annotations.action | html }}{{ else }}Find this rule and its first matching event at the alert time. Check the component's current status and dependencies; verify any in-flight transaction before retrying.{{ end }}{{ else }}Signal: This alert condition is no longer firing.
          Verify: {{ if .Annotations.recovery }}{{ .Annotations.recovery | html }}{{ else }}Confirm fresh telemetry and recovery of the component named above. Missing data or an expired alert window is not proof that the cause was fixed.{{ end }}{{ end }}
          <a href="https://github.com/loyal-labs/loyal-yield-routing/blob/main/docs/vault-alerts.md">Alert runbook</a>

          {{ end }}
  # Empty until the external dead man's switch exists. Then add:
  #   webhook_configs:
  #     - url_file: /run/credentials/prometheus-alertmanager.service/heartbeat_url
  #       send_resolved: false
  # and the heartbeat_url line in alertmanager.service.d/telegram.conf.
  - name: heartbeat
  # Empty until the owner names a private chat for xstock alerts. They stay
  # visible in Alertmanager meanwhile.
  - name: xstock

  # No notification channel: diagnostic warnings remain queryable.
  - name: diagnostics
