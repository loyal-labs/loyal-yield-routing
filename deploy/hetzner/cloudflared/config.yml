# Locally managed tunnel loyal-workers, set up as robinx-prod's: Cloudflare
# serves askloyal.com, www, app, next, admin, admin-next, stats, stats-next and
# the Telegram webhook on tgbot.askloyal.com, and cloudflared carries them to
# loyal-web, loyal-admin, loyal-stats and loyal-telegram on loopback. backend
# is served too (since Nov 5 2026, a proxied CNAME to this tunnel). The apex,
# www, app and backend hosts' /_next/ assets come from loyal-frontend.vercel.app,
# for the pages loyal-web proxies. No httpHostHeader on admin: its CSRF check
# compares Origin with Host.
# The credentials file is the one `cloudflared tunnel create` wrote; it lives
# only on the host (deploy/hetzner/README.md, "Web (loyal-web)").
tunnel: 6db5af77-f25b-40de-85aa-89ff2151a053
credentials-file: /etc/cloudflared/loyal-workers.json
ingress:
  - hostname: tgbot.askloyal.com
    path: ^/api/telegram/webhook$
    service: http://127.0.0.1:10083
  - hostname: tgbot.askloyal.com
    service: http_status:404
  - hostname: askloyal.com
    path: ^/_next/
    service: https://loyal-frontend.vercel.app
    originRequest:
      httpHostHeader: loyal-frontend.vercel.app
  - hostname: askloyal.com
    service: http://127.0.0.1:10080
  - hostname: www.askloyal.com
    path: ^/_next/
    service: https://loyal-frontend.vercel.app
    originRequest:
      httpHostHeader: loyal-frontend.vercel.app
  - hostname: www.askloyal.com
    service: http://127.0.0.1:10080
  - hostname: app.askloyal.com
    path: ^/_next/
    service: https://loyal-frontend.vercel.app
    originRequest:
      httpHostHeader: loyal-frontend.vercel.app
  - hostname: app.askloyal.com
    service: http://127.0.0.1:10080
  - hostname: backend.askloyal.com
    path: ^/_next/
    service: https://loyal-frontend.vercel.app
    originRequest:
      httpHostHeader: loyal-frontend.vercel.app
  - hostname: backend.askloyal.com
    service: http://127.0.0.1:10080
  - hostname: next.askloyal.com
    service: http://127.0.0.1:10080
  - hostname: admin.askloyal.com
    service: http://127.0.0.1:10081
  - hostname: admin-next.askloyal.com
    service: http://127.0.0.1:10081
  - hostname: stats.askloyal.com
    service: http://127.0.0.1:10082
  - hostname: stats-next.askloyal.com
    service: http://127.0.0.1:10082
  - service: http_status:404
