# shellcheck shell=bash disable=SC2034
# robinX dev and test: robinx-prod :55432 to the arm64 robinX box; the rehearsal of robinx.conf.
BOX=robinx-main
SRC_SSH=root@5.161.126.23
SRC_SOCKET=/run/robinx-postgres-test
SRC_PORT=55432
SRC_OSUSER=robinx-test
DST_CLUSTER='test'
DST_PORT=55432
LOCALE_PROVIDER=builtin
LOCALE=C.UTF-8
DATABASES=(robinx_dev:all robinx_test:all)
SYNC_WORKERS=4
# Forward mode, as loyal.conf: the box reads the source only as pgmove through the forward-only
# pgmove-fwd (fwd-user.sh), and root steps on the source come from the operator's PGMOVE_SRC_ADMIN.
SRC_VIA=forward
FWD_SSH=pgmove-fwd@5.161.126.23
FWD_TARGET=/run/robinx-postgres-test/.s.PGSQL.55432
FWD_PORT=15532
# The source script adds this above the test cluster's final local reject: pgmove reads postgres too.
SRC_HBA_LINE="local postgres,robinx_dev,robinx_test pgmove scram-sha-256"
REV_PORT=25532
REV_HOST=127.0.0.1
DST_VOLUME=/srv/robinx-data
# Not /etc/pgmove/freeze: production on the same box refuses its deploys while that one exists.
# Dev migrations read no marker, so freeze-test is the record only.
FREEZE_MARKER=/etc/pgmove/freeze-test
MIGRATE_MARKER=none
