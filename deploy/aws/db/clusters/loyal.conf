# shellcheck shell=bash disable=SC2034
# Loyal: loyal-db-primary (10.92.1.1, ssh alias through loyal-workers) to the arm64 Loyal box.
# kamino_timescale publishes its plain tables; its hypertables move by backfill and catchup.
BOX=loyal-main
SRC_SSH=loyal-db-primary
SRC_SOCKET=/var/run/postgresql
SRC_PORT=5432
SRC_OSUSER=postgres
DST_CLUSTER=main
DST_PORT=5432
LOCALE_PROVIDER=libc
LOCALE=C.UTF-8
DATABASES=(loyal_app:all loyal_yield_prod:all kamino_timescale:plain)
HYPERTABLES=(kamino.reserve_updates loyal_prod.balance_sweep_wallet_ata_observations)
HT_DB=kamino_timescale
SYNC_WORKERS=2
COPY_SETTINGS=(shared_preload_libraries timescaledb.max_background_workers)
FWD_PORT=15433
REV_PORT=25433
# Not /etc/pgmove/freeze: robinX deploys refuse while that one exists. Loyal migrations are frozen by convention.
FREEZE_MARKER=/etc/pgmove/freeze-loyal
CUT_OLD=loyal-workers
CUT_NEW=loyal-main
CUT_TIMERS=(loyal-web-cron-smart-account-reconcile.timer loyal-web-cron-earn-yield-joy.timer)
CUT_ONESHOTS=(loyal-web-cron@smart-account-reconcile.service loyal-web-cron@earn-yield-joy.service)
CUT_ENGINES=(loyal-retail loyal-backyard loyal-earn-max)
CUT_SERVICES=(loyal-observer loyal-realtime loyal-telegram loyal-web loyal-admin loyal-stats)
CUT_HEALTH=("loyal-web=10080/readyz" "loyal-admin=10081/readyz" "loyal-stats=10082/readyz" "loyal-telegram=10083/healthz" "loyal-realtime=10000/readyz" "loyal-observer=9101/metrics" "loyal-retail=9102/metrics" "loyal-backyard=9103/metrics" "loyal-earn-max=9105/metrics")
