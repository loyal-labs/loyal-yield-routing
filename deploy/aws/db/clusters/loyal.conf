# shellcheck shell=bash disable=SC2034
# Loyal: loyal-db-primary (10.92.1.1, ssh alias through loyal-workers) to the arm64 Loyal box.
# The box holds no key for a shell on either Hetzner box: its forward logs in to loyal-workers as
# the forward-only FWD_USER (remote.sh route) and reaches 10.92.1.1:5432 over TLS as pgmove.
# kamino_timescale publishes its plain tables; its hypertables move by backfill and catchup.
BOX=loyal-main
SRC_SSH=loyal-db-primary
SRC_SOCKET=/var/run/postgresql
SRC_PORT=5432
SRC_OSUSER=postgres
DST_CLUSTER=main
DST_DATA=/srv/postgresql/18/main
DST_VOLUME=/srv/postgresql
# The target runs Loyal's own production settings, staged from loyal-db-primary by
# deploy/aws/loyal-main-config.sh, under pgmove's. zz-replica.conf is the Neon subscriber's worker
# budget (deploy/hetzner/db/replica.sh); it sorts after zz-pgmove.conf and would cap the workers.
DST_CONF_FROM=/opt/loyal-db-staged/etc/postgresql/18/main/conf.d
DST_CONF_SKIP=(zz-replica.conf)
DST_PORT=5432
LOCALE_PROVIDER=libc
LOCALE=C.UTF-8
# Not loyal_yield_staging: loyal-db-primary has no such database (Nov 17, pg_database lists
# kamino_timescale, loyal_app, loyal_yield_prod, postgres); only its roles exist, and init copies roles.
DATABASES=(loyal_app:all loyal_yield_prod:all kamino_timescale:plain)
HYPERTABLES=(kamino.reserve_updates loyal_prod.balance_sweep_wallet_ata_observations)
HT_DB=kamino_timescale
SYNC_WORKERS=2
COPY_SETTINGS=(shared_preload_libraries timescaledb.max_background_workers)
SRC_VIA=forward
SRC_SSLMODE=require
SRC_HBA_FROM=10.92.1.2/32
FWD_HOP=loyal-workers
FWD_USER=pgmove-fwd
FWD_SSH=pgmove-loyal
FWD_TARGET=10.92.1.1:5432
FWD_PORT=15433
REV_PORT=25433
# The reverse listener: pg-forward@loyal binds it on loyal-workers' private address with -R, where
# loyal-db-primary reaches it; remote.sh route allows that one listener for FWD_USER.
REV_HOST=10.92.1.2
# Not /etc/pgmove/freeze: robinX deploys refuse while that one exists. Loyal migrations are frozen by convention:
# loyal-migrate reads no marker, so freeze-loyal is the record only.
FREEZE_MARKER=/etc/pgmove/freeze-loyal
MIGRATE_MARKER=none
CUT_OLD=loyal-workers
CUT_NEW=loyal-main
CUT_TIMERS=(loyal-web-cron-smart-account-reconcile.timer loyal-web-cron-earn-yield-joy.timer)
CUT_ONESHOTS=(loyal-web-cron@smart-account-reconcile.service loyal-web-cron@earn-yield-joy.service)
CUT_ENGINES=(loyal-retail loyal-backyard loyal-earn-max)
CUT_SERVICES=(loyal-observer loyal-realtime loyal-telegram loyal-web loyal-admin loyal-stats)
CUT_SRCSTOP=(loyal-db-retention.timer loyal-db-retention.service)
CUT_HEALTH=("loyal-web=10080/readyz" "loyal-admin=10081/readyz" "loyal-stats=10082/readyz" "loyal-telegram=10083/healthz" "loyal-realtime=10000/readyz" "loyal-observer=9101/metrics" "loyal-retail=9102/metrics" "loyal-backyard=9103/metrics" "loyal-earn-max=9105/metrics")
