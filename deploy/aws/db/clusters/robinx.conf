# shellcheck shell=bash disable=SC2034
# robinX production: robinx-prod :5432 to the arm64 robinX box. Read by pgmove.sh and cutover.sh.
BOX=robinx-main
SRC_SSH=root@5.161.126.23
SRC_SOCKET=/run/robinx-postgres
SRC_PORT=5432
SRC_OSUSER=postgres
DST_CLUSTER=production
# On the data volume like parsers and test; the default /var/lib/postgresql sits on the root disk.
DST_DATA=/srv/robinx-data/production
DST_VOLUME=/srv/robinx-data
DST_PORT=5432
LOCALE_PROVIDER=builtin
LOCALE=C.UTF-8
DATABASES=(robinx:all)
SYNC_WORKERS=4
# Production's tuning from /etc/robinx-postgres/production.conf, one file that also sets paths, port
# and archiving, so it cannot be a DST_CONF_FROM conf.d; both boxes have 61 GiB.
COPY_SETTINGS=(shared_preload_libraries pg_stat_statements.track shared_buffers effective_cache_size work_mem
  maintenance_work_mem autovacuum_work_mem autovacuum_max_workers max_connections superuser_reserved_connections
  checkpoint_timeout checkpoint_completion_target max_wal_size min_wal_size wal_buffers wal_compression
  effective_io_concurrency maintenance_io_concurrency max_parallel_maintenance_workers max_parallel_workers
  max_parallel_workers_per_gather max_slot_wal_keep_size temp_file_limit idle_in_transaction_session_timeout
  track_io_timing track_wal_io_timing log_line_prefix log_min_error_statement)
FWD_PORT=15432
REV_PORT=25432
FREEZE_MARKER=/etc/pgmove/freeze
# wen deploy/activate-release.sh and robinx-slot migrate refuse pending migrations while this exists.
MIGRATE_MARKER=/etc/pgmove/freeze
FENCE_KEEP=(robinx_back robinx_verify)
CUT_OLD=root@5.161.126.23
CUT_NEW=robinx-main
CUT_TIMERS=(robinx-trim-data.timer robinx-textfile.timer)
CUT_ONESHOTS=(robinx-trim-data.service robinx-textfile.service)
CUT_ENGINES=(robinx-wallet-indexer)
# LIVE_SLOT is the slot robinx-slot live names on CUT_OLD when cutover.sh runs; the slot alternates on every deploy.
# The tunnel and monitoring move with the app: switch starts them on CUT_NEW only once they are checked
# stopped on CUT_OLD, and rollback the other way, so two cloudflared connectors never share the tunnel.
CUT_SERVICES=(robinx@LIVE_SLOT cloudflared prometheus alertmanager node_exporter postgres_exporter@production)
# Both slots stop with the writers and are checked stopped; only the live one is started on the new box.
CUT_STOP=(robinx@8080 robinx@8081)
CUT_HEALTH=("robinx@LIVE_SLOT=LIVE_SLOT/readyz")
