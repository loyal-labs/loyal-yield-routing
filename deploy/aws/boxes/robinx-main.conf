# shellcheck shell=bash disable=SC2034
# robinX product box: robinx-prod (17 units) and mnemonic (2). PLAN ledger rows 5, 8, 15, 16, 17.
# PROFILE stays empty until the quota read: `main` if its vCPU quota is 64, else the new `robinx` account.
# Then `AWS_PROFILE=<profile> box.sh robinx-main`, or write it here.
PROFILE=main
ACCOUNT=227949368511
REGION=us-east-1
INSTANCE_TYPE=r7g.2xlarge
ARCH=arm64
# Required: path to the ssh public key the box trusts. Empty falls back to BOX_PUBKEY.
PUBKEY=
# name:GB[:iops[:MB/s]]; root is the boot disk, the rest attach as /dev/sdf, /dev/sdg in order.
VOLUMES=(root:50 data:750:6000:375 mnemonic:150)
# pgBackRest repo bucket for backup.sh; carries the account id so the name is unique.
BACKUP_BUCKET=robinx-pgbackrest-227949368511
# Stanzas on the box (backup.sh): name|repo1-path|cluster|port|pg data dir|socket dir. The robinX production cluster is one more line:
#   "robinx|/robinx|production|5432|/srv/robinx-data/production|/run/robinx-postgres"
# Retention mirrors the Hetzner robinX and parsers stanzas: fulls kept 14 days, diffs 7, weekly full (parsers Sun 09:00 UTC).
BOX_SSH=robinx-main
PG_MAJOR=18
STANZAS=("parsers|/parsers|parsers|5433|/srv/robinx-data/parsers|/var/run/postgresql")
RETENTION_FULL=14
RETENTION_FULL_TYPE=time
RETENTION_DIFF=7
# The data volume is gp3 375 MB/s; read at about a third of it.
BACKUP_READ_MBPS=120
UNITS=(robinx-parsers-backup@.service robinx-parsers-backup-full.timer)
