# shellcheck shell=bash disable=SC2034
# Loyal product box: loyal-workers-1 Loyal units (17) and loyal-db-primary (11). Account `loyal`, PLAN table.
PROFILE=loyal
ACCOUNT=026852303320
REGION=us-east-1
INSTANCE_TYPE=r7g.2xlarge
ARCH=arm64
# Required: path to the ssh public key the box trusts. Empty falls back to BOX_PUBKEY.
PUBKEY=
VOLUMES=(root:50 database:300 services:150)
# Extra inbound rules, proto:port:cidr, on top of tcp 22. tcp 80 and 443 are Caddy (realtime.askloyal.com, the ClickStack sslip name; ACME HTTP-01 needs 80), udp 51820 is the WireGuard deploy tunnel loyal-ci. Same rules as loyal-workers serves.
INGRESS=(udp:51820:0.0.0.0/0 tcp:80:0.0.0.0/0 tcp:443:0.0.0.0/0)
# pgBackRest repo bucket for backup.sh; carries the account id so the name is unique.
BACKUP_BUCKET=loyal-pgbackrest-026852303320
# Stanzas on the box (backup.sh): name|repo1-path|cluster|port|pg data dir|socket dir. A second cluster is one more line.
# Retention mirrors loyal-db-primary: two fulls, seven diffs, weekly full and daily diff at 03:00 UTC (units staged by loyal-main-config.sh, disabled).
BOX_SSH=loyal-main
PG_MAJOR=18
STANZAS=("loyal|/loyal|main|5432|/srv/postgresql/18/main|/var/run/postgresql")
RETENTION_FULL=2
RETENTION_FULL_TYPE=count
RETENTION_DIFF=7
# The first full reads the database volume (gp3, 125 MB/s) next to a live subscriber; read at about half of it.
BACKUP_READ_MBPS=60
VERIFY_UNITS=(loyal-db-backup@.service loyal-db-backup-full.timer loyal-db-backup-diff.timer)
