# shellcheck shell=bash disable=SC2034
# Live xstock bot: xstock-bot, xstock-pools and five timers (7 units). PLAN ledger row 6.
# PROFILE stays empty until the quota read: `main` if its vCPU quota is 64, else `loyal` beside loyal-main.
# Then `AWS_PROFILE=<profile> box.sh xstock-live`, or write it here.
PROFILE=main
ACCOUNT=
REGION=us-east-1
INSTANCE_TYPE=m7i.2xlarge
ARCH=x86_64
# Required: path to the ssh public key the box trusts. Empty falls back to BOX_PUBKEY.
PUBKEY=
VOLUMES=(root:100)
