services:
  - type: worker
    name: loyal-kamino-reserve-monitor
    runtime: rust
    region: oregon
    plan: starter
    buildCommand: cargo build --release -p kamino-reserve-monitor -p kamino-timescale-migrations
    preDeployCommand: ./target/release/kamino-timescale-migrations --apply && ./target/release/kamino-reserve-monitor --sync-supported-reserves
    startCommand: ./target/release/kamino-reserve-monitor
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TIMESCALEDB_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: KAMINO_UPDATE_SOURCE
        value: laserstream
      - key: HELIUS_API_KEY
        sync: false
      - key: LASERSTREAM_ENDPOINT
        value: https://laserstream-mainnet-ewr.helius-rpc.com
      - key: KAMINO_API_BASE
        value: https://api.kamino.finance
      - key: RUST_LOG
        value: info
