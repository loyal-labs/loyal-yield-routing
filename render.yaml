projects:
  - name: loyal-yield-laserstream-workers
    environments:
      - name: production
        services:
          - type: worker
            name: loyal-kamino-reserve-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-88e794f30cb42ebb3c810c65912c7d5cb8ea9d3c
            preDeployCommand: /usr/local/bin/kamino-monitor-predeploy
            dockerCommand: /usr/local/bin/kamino-reserve-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: production
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: KAMINO_UPDATE_SOURCE
                value: laserstream
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: KAMINO_API_BASE
                value: https://api.kamino.finance
              - key: RUST_LOG
                value: warn,kamino_reserve_monitor=info

          - type: worker
            name: loyal-balance-sweep-ata-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-f6256a5c7fff047656e4189322f6abe6774f7a46
            preDeployCommand: /bin/sh -lc /usr/local/bin/loyal-timescale-migrations${IFS}--apply&&/usr/local/bin/yield-migrations${IFS}--apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: production
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: SOLANA_RPC_URL
                sync: false
              - key: EARN_MAX_DELEGATE
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-4807dfef76f23b432696fc0335414a713c109b41
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: staging
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: DISABLE_EARN_APY_REFRESH
                value: "true"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

