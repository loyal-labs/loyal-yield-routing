projects:
  - name: loyal-yield-laserstream-workers
    environments:
      - name: production
        services:
          - type: worker
            name: loyal-kamino-reserve-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/kamino-reserve-monitor --sync-supported-reserves
            dockerCommand: /usr/local/bin/kamino-reserve-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: KAMINO_UPDATE_SOURCE
                value: laserstream
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: KAMINO_API_BASE
                value: https://api.kamino.finance
              - key: RUST_LOG
                value: warn,kamino_reserve_monitor=info

          - type: worker
            name: loyal-balance-sweep-ata-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

  - name: loyal-yield-light-workers
    environments:
      - name: production
        services:
          - type: web
            name: loyal-yield-realtime
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-4ead255ae260e7ddf31234e632c021d26e91b290
            dockerCommand: /usr/local/bin/loyal-yield-realtime
            healthCheckPath: /healthz
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: REALTIME_AUTH_SECRET
                sync: false
              - key: REALTIME_AUTH_PREVIOUS_SECRET
                sync: false
              - key: REALTIME_ALLOWED_ORIGINS
                value: https://askloyal.com,https://www.askloyal.com,https://app.askloyal.com
              - key: REALTIME_HEARTBEAT_SECONDS
                value: "15"
              - key: REALTIME_CATCH_UP_LIMIT
                value: "500"
              - key: REALTIME_CLIENT_BUFFER
                value: "1024"
              - key: REALTIME_MAX_TOKEN_LIFETIME_SECONDS
                value: "300"
              - key: REALTIME_RETENTION_DAYS
                value: "7"
              - key: REALTIME_RETENTION_BATCH_SIZE
                value: "1000"
              - key: REALTIME_RETENTION_INTERVAL_SECONDS
                value: "3600"
              - key: REALTIME_READY_MAX_LAG
                value: "1000"
              - key: RUST_LOG
                value: warn,loyal_yield_realtime=info

          - type: worker
            name: loyal-balance-sweep-ata-projector
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-projector
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: RUST_LOG
                value: warn,balance_sweep_ata_projector=info

          - type: worker
            name: loyal-balance-sweep-autodeposit-trigger
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-5fc5f7825a717cfb0ccaab57cee5e38f09aa7f53
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-autodeposit-trigger --execute-eligible
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: POLICY_KEYPAIR
                sync: false
              - key: SOLANA_TESTING_PK
                sync: false
              - key: BALANCE_SWEEP_EXECUTOR_COMMAND
                value: bun scripts/execute-autodeposit-policy.ts --require-lot-claim
              - key: BALANCE_SWEEP_EXECUTE_ELIGIBLE
                value: "true"
              - key: BALANCE_SWEEP_REALTIME_DEBOUNCE_MILLISECONDS
                value: "250"
              - key: BALANCE_SWEEP_REALTIME_HINT_QUEUE_CAPACITY
                value: "1024"
              - key: BALANCE_SWEEP_REALTIME_CHANNEL
                value: loyal_yield_autodeposit_wakeup
              - key: SOLANA_WEEK_NOTIFY_ENDPOINT
                value: https://askloyal.com/api/solana-week/sweep-notify
              - key: SOLANA_WEEK_NOTIFY_SECRET
                sync: false
              - key: RUST_LOG
                value: warn,balance_sweep_autodeposit_trigger=info

          - type: worker
            name: loyal-fleet-opportunity-planner
            runtime: image
            region: oregon
            plan: standard
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/fleet-opportunity-planner --poll-interval-seconds 1 --full-sweep-interval-seconds 30 --dirty-batch-size 256 --max-opportunities-per-wave 128
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: RUST_LOG
                value: warn,fleet_opportunity_planner=info

          - type: worker
            name: loyal-fleet-route-revalidator
            runtime: image
            region: oregon
            plan: standard
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-reserve-swap --fleet-worker revalidate --concurrency 16 --fused-execute-concurrency 8 --poll-interval-milliseconds 250
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: POLICY_KEYPAIR
                sync: false
              - key: YIELD_ROUTE_FEE_PAYER_KEYPAIRS
                sync: false
              - key: RUST_LOG
                value: warn,same_mint_reserve_swap=info

          - type: worker
            name: loyal-fleet-route-executor
            runtime: image
            region: oregon
            plan: standard
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-reserve-swap --fleet-worker execute --concurrency 4 --poll-interval-milliseconds 250
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: POLICY_KEYPAIR
                sync: false
              - key: YIELD_ROUTE_FEE_PAYER_KEYPAIRS
                sync: false
              - key: RUST_LOG
                value: warn,same_mint_reserve_swap=info

          - type: worker
            name: loyal-fleet-route-confirmer
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/fleet-route-confirmer --execute --batch-size 128 --broadcast-concurrency 16 --poll-interval-milliseconds 1000
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: RUST_LOG
                value: warn,fleet_route_confirmer=info

          - type: worker
            name: loyal-fleet-route-reconciler
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-reserve-swap --fleet-reconciler --concurrency 32 --batch-size 32 --poll-interval-milliseconds 250 --position-sweep-interval-seconds 300
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: RUST_LOG
                value: warn,same_mint_reserve_swap=info

          - type: worker
            name: loyal-route-lookup-table-provisioner
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-7ddd0c16d39e121c0fcbab51ebd00be79f8abeda
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/route-lookup-table-provisioner --execute --watch --max-operations 32 --concurrency 8 --rate-limit-ms 250
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ALT_CLUSTER
                value: mainnet-beta
              - key: POLICY_KEYPAIR
                sync: false
              - key: YIELD_ALT_MAX_LAMPORTS
                value: "2000000000"
              - key: YIELD_ALT_BUDGET_WINDOW_SECONDS
                value: "86400"
              - key: RUST_LOG
                value: warn,route_lookup_table_provisioner=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-projector-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-projector
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: RUST_LOG
                value: warn,balance_sweep_ata_projector=info

          - type: worker
            name: loyal-balance-sweep-autodeposit-trigger-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-autodeposit-trigger
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: BALANCE_SWEEP_EXECUTE_ELIGIBLE
                value: "false"
              - key: RUST_LOG
                value: warn,balance_sweep_autodeposit_trigger=info

          - type: worker
            name: loyal-same-mint-yield-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-yield-monitor --all-active-vaults --poll-interval-seconds 300 --rebalance-cooldown-seconds 300
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: POLICY_KEYPAIR
                sync: false
              - key: RUST_LOG
                value: warn,same_mint_yield_monitor=info
