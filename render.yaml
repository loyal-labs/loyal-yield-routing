services:
  - type: worker
    name: loyal-kamino-reserve-monitor
    runtime: docker
    region: oregon
    plan: starter
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: /usr/local/bin/kamino-reserve-monitor --sync-supported-reserves
    dockerCommand: /usr/local/bin/kamino-reserve-monitor
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TIMESCALEDB_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: KAMINO_UPDATE_SOURCE
        value: laserstream
      - key: HELIUS_API_KEY
        sync: false
      - key: LASERSTREAM_ENDPOINT
        value: https://laserstream-mainnet-ewr.helius-rpc.com
      - key: KAMINO_API_BASE
        value: https://api.kamino.finance
      - key: RUST_LOG
        value: warn,kamino_reserve_monitor=info

  - type: worker
    name: loyal-balance-sweep-ata-monitor
    runtime: docker
    region: oregon
    plan: starter
    autoDeploy: false
    dockerfilePath: ./Dockerfile.balance-sweep-ata-monitor
    dockerContext: .
    dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: TIMESCALEDB_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: BALANCE_SWEEP_UPDATE_SOURCE
        value: laserstream
      - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
        value: "300"
      - key: HELIUS_API_KEY
        sync: false
      - key: LASERSTREAM_ENDPOINT
        value: https://laserstream-mainnet-ewr.helius-rpc.com
      - key: RUST_LOG
        value: warn,balance_sweep_ata_monitor=info

  - type: worker
    name: loyal-balance-sweep-ata-projector
    runtime: docker
    region: oregon
    plan: starter
    autoDeploy: false
    dockerfilePath: ./Dockerfile.balance-sweep-ata-monitor
    dockerContext: .
    dockerCommand: /usr/local/bin/balance-sweep-ata-projector
    maxShutdownDelaySeconds: 60
    envVars:
      - key: TIMESCALEDB_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: RUST_LOG
        value: warn,balance_sweep_ata_monitor=info
