projects:
  - name: loyal-yield-laserstream-workers
    environments:
      - name: production
        services:
          - type: worker
            name: loyal-kamino-reserve-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-0e119f301d633f4c849d7bec15a17ba818f00dcf
            preDeployCommand: /usr/local/bin/kamino-monitor-predeploy
            dockerCommand: /usr/local/bin/kamino-reserve-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: production
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: KAMINO_UPDATE_SOURCE
                value: laserstream
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: KAMINO_API_BASE
                value: https://api.kamino.finance
              - key: RUST_LOG
                value: warn,kamino_reserve_monitor=info

          - type: worker
            name: loyal-balance-sweep-ata-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-95f8f24d070dba93b5c478a1c4ac725cad461c27
            preDeployCommand: /bin/sh -lc /usr/local/bin/loyal-timescale-migrations${IFS}--apply&&/usr/local/bin/yield-migrations${IFS}--apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: production
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: SOLANA_RPC_URL
                sync: false
              - key: EARN_MAX_DELEGATE
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-6b2e99eb5bccf0bab8738cdbae97c574c3feaf2f
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: OBSERVABILITY_ENABLED
                value: "true"
              - key: OBSERVABILITY_ENVIRONMENT
                value: staging
              - key: OBSERVABILITY_OTLP_ENDPOINT
                value: https://loyal-clickstack.onrender.com
              - key: OBSERVABILITY_INGESTION_API_KEY
                sync: false
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: DISABLE_EARN_APY_REFRESH
                value: "true"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

