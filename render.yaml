projects:
  - name: loyal-yield-laserstream-workers
    environments:
      - name: production
        services:
          - type: worker
            name: loyal-kamino-reserve-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/kamino-reserve-monitor --sync-supported-reserves
            dockerCommand: /usr/local/bin/kamino-reserve-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: KAMINO_UPDATE_SOURCE
                value: laserstream
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: KAMINO_API_BASE
                value: https://api.kamino.finance
              - key: RUST_LOG
                value: warn,kamino_reserve_monitor=info

          - type: worker
            name: loyal-balance-sweep-ata-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/laserstream-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /bin/sh -lc '/usr/local/bin/loyal-timescale-migrations --apply && /usr/local/bin/yield-migrations --apply'
            dockerCommand: /usr/local/bin/balance-sweep-ata-monitor
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: SOLANA_RPC_URL
                sync: false
              - key: BALANCE_SWEEP_UPDATE_SOURCE
                value: laserstream
              - key: BALANCE_SWEEP_TARGET_REFRESH_SECONDS
                value: "300"
              - key: EARN_APY_REFRESH_INTERVAL_SECONDS
                value: "3600"
              - key: EARN_APY_RISK_PROFILES
                value: safe
              - key: HELIUS_API_KEY
                sync: false
              - key: LASERSTREAM_ENDPOINT
                value: https://laserstream-mainnet-ewr.helius-rpc.com
              - key: RUST_LOG
                value: warn,balance_sweep_ata_monitor=info

  - name: loyal-yield-light-workers
    environments:
      - name: production
        services:
          - type: worker
            name: loyal-balance-sweep-ata-projector
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-projector
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: production
              - key: RUST_LOG
                value: warn,balance_sweep_ata_projector=info

          - type: worker
            name: loyal-balance-sweep-autodeposit-trigger
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-autodeposit-trigger --execute-eligible
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: POLICY_KEYPAIR
                sync: false
              - key: SOLANA_TESTING_PK
                sync: false
              - key: BALANCE_SWEEP_EXECUTOR_COMMAND
                value: bun scripts/execute-autodeposit-policy.ts --require-lot-claim
              - key: BALANCE_SWEEP_EXECUTE_ELIGIBLE
                value: "true"
              - key: RUST_LOG
                value: warn,balance_sweep_autodeposit_trigger=info

          - type: worker
            name: loyal-same-mint-yield-monitor
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-242353585de1160fc3135f545ff1b9da9398e4ea
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-yield-monitor --all-active-vaults --execute --poll-interval-seconds 300 --rebalance-cooldown-seconds 300
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ROUTER_KEYPAIR
                sync: false
              - key: RUST_LOG
                value: warn,same_mint_yield_monitor=info

      - name: staging
        services:
          - type: worker
            name: loyal-balance-sweep-ata-projector-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-ata-projector
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: BALANCE_SWEEP_ATA_STREAM
                value: staging
              - key: RUST_LOG
                value: warn,balance_sweep_ata_projector=info

          - type: worker
            name: loyal-balance-sweep-autodeposit-trigger-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/balance-sweep-autodeposit-trigger
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: BALANCE_SWEEP_EXECUTE_ELIGIBLE
                value: "false"
              - key: RUST_LOG
                value: warn,balance_sweep_autodeposit_trigger=info

          - type: worker
            name: loyal-same-mint-yield-monitor-staging
            runtime: image
            region: oregon
            plan: starter
            autoDeploy: false
            image:
              url: ghcr.io/loyal-labs/loyal-yield-routing/light-workers:sha-ce5fe2ead0ab55bf3cac4a597cf6aac52232ee3a
            preDeployCommand: /usr/local/bin/yield-migrations --apply
            dockerCommand: /usr/local/bin/same-mint-yield-monitor --all-active-vaults --poll-interval-seconds 300 --rebalance-cooldown-seconds 300
            maxShutdownDelaySeconds: 60
            envVars:
              - key: NEON_DATABASE_URL
                sync: false
              - key: TIMESCALEDB_URL
                sync: false
              - key: SOLANA_RPC_URL
                sync: false
              - key: YIELD_ROUTER_KEYPAIR
                sync: false
              - key: RUST_LOG
                value: warn,same_mint_yield_monitor=info
