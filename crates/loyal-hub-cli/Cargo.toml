[package]
name = "loyal-hub-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for inspecting and executing Loyal Hub swap program instructions"

[[bin]]
name = "loyal-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
loyal-actions = { path = "../loyal-actions" }
loyal-hub-abi.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
solana-account-decoder.workspace = true
solana-client.workspace = true
solana-program.workspace = true
solana-sdk.workspace = true
spl-token.workspace = true
