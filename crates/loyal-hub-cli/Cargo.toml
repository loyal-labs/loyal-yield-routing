[package]
name = "loyal-hub-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for inspecting and executing Loyal Hub swap program instructions"

[[bin]]
name = "loyal-hub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
loyal-actions = { path = "../loyal-actions" }
loyal-hub-abi.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder = "2.3"
solana-client = "2.3"
solana-program.workspace = true
solana-sdk.workspace = true
spl-token.workspace = true
