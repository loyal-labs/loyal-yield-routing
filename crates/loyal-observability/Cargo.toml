[package]
name = "loyal-observability"
version = "0.1.0"
edition = "2021"
description = "Privacy-safe OTLP logs, metrics, and traces for Loyal Rust services"

[dependencies]
opentelemetry = { version = "0.32", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "logs", "metrics", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs", "metrics", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing.workspace = true
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
url = "2"
