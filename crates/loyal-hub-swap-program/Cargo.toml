[package]
name = "loyal-hub-swap-program"
version = "0.1.0"
edition = "2021"
description = "Small policy-gated stable swap hub for Loyal yield routing tests"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
loyal-hub-abi.workspace = true
pinocchio = "0.9.3"
pinocchio-pubkey = { version = "0.3.0", features = ["const"] }
pinocchio-tkn = "0.2.2"
