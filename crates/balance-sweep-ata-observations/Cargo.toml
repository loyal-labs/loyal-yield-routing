[package]
name = "balance-sweep-ata-observations"
version = "0.1.0"
edition = "2021"
description = "Lightweight Timescale observation access for Loyal balance sweep ATA telemetry"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
loyal-yield-orchestrator = { path = "../loyal-yield-orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }

