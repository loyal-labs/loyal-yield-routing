[package]
name = "balance-sweep-ata-observations"
version = "0.1.0"
edition = "2021"
description = "Lightweight Timescale observation access for Loyal balance sweep ATA telemetry"

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
futures-util.workspace = true
loyal-yield-store = { path = "../loyal-yield-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
