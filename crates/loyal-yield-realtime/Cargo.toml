[package]
name = "loyal-yield-realtime"
version = "0.1.0"
edition = "2021"
description = "Server-sent event gateway for Loyal Yield realtime invalidations"

[dependencies]
axum = "0.8"
futures-util = "0.3"
loyal-yield-realtime-core = { path = "../loyal-yield-realtime-core" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
