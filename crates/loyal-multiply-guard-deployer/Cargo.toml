[package]
name = "loyal-multiply-guard-deployer"
version = "0.1.0"
edition = "2021"
description = "Dry-run-first mainnet deployer for the pinned Loyal Multiply guard"

[[bin]]
name = "loyal-multiply-guard-deployer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bincode = "1.3"
loyal-solana-env = { path = "../loyal-solana-env" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
solana-client.workspace = true
solana-loader-v3-interface = { version = "3.0.0", features = ["bincode", "serde"] }
solana-sdk.workspace = true
solana-transaction-status-client-types.workspace = true
