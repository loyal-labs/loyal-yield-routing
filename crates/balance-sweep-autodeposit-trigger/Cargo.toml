[package]
name = "balance-sweep-autodeposit-trigger"
version = "0.1.0"
edition = "2021"
description = "Surplus lot scheduling for Loyal autodeposit triggers"

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-realtime-core = { path = "../loyal-yield-realtime-core" }
loyal-yield-store = { path = "../loyal-yield-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
