[package]
name = "balance-sweep-autodeposit-trigger"
version = "0.1.0"
edition = "2021"
description = "Surplus lot scheduling for Loyal autodeposit triggers"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-realtime-core = { path = "../loyal-yield-realtime-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
