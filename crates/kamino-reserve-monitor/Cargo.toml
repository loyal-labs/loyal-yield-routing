[package]
name = "kamino-reserve-monitor"
version = "0.1.0"
edition = "2021"
description = "Kamino reserve account monitor for Loyal yield signals and Timescale audit writes"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.4", features = ["termination"] }
futures-util = "0.3"
helius-laserstream = "0.1"
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-actions = { path = "../loyal-actions" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account-decoder = "2.3"
solana-client = "2.3"
solana-pubsub-client = "2.3"
solana-sdk.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
