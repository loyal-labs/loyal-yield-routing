[package]
name = "kamino-reserve-monitor"
version = "0.1.0"
edition = "2021"
description = "Kamino reserve account monitor for Loyal yield signals and Timescale audit writes"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = { version = "3.4", features = ["termination"] }
futures-util.workspace = true
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
laserstream-core-client = "9.0.2"
laserstream-core-proto = { version = "9.0.2", default-features = false, features = ["tonic", "tonic-compression"] }
loyal-actions = { path = "../loyal-actions" }
loyal-kamino-codec = { path = "../loyal-kamino-codec" }
loyal-kamino-data = { path = "../loyal-kamino-data" }
loyal-observability = { path = "../loyal-observability" }
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
solana-account-decoder.workspace = true
solana-client.workspace = true
solana-pubsub-client.workspace = true
solana-sdk.workspace = true
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
