[package]
name = "balance-sweep-ata-monitor"
version = "0.1.0"
edition = "2021"
description = "Wallet USDC ATA monitor for Loyal balance sweep targets"

[dependencies]
anyhow = "1"
base64 = "0.22"
balance-sweep-ata-observations = { path = "../balance-sweep-ata-observations" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
helius-laserstream = "0.1"
loyal-actions = { path = "../loyal-actions" }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-orchestrator = { path = "../loyal-yield-orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account-decoder = "2.3"
solana-client = "2.3"
solana-pubsub-client = "2.3"
solana-program.workspace = true
solana-sdk.workspace = true
spl-token.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
