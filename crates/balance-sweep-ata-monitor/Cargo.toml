[package]
name = "balance-sweep-ata-monitor"
version = "0.1.0"
edition = "2021"
description = "Wallet USDC ATA monitor for Loyal balance sweep targets"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bincode = "1.3"
balance-sweep-ata-observations = { path = "../balance-sweep-ata-observations" }
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
futures-util.workspace = true
helius-laserstream = "0.1"
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-actions = { path = "../loyal-actions" }
loyal-kamino-data = { path = "../loyal-kamino-data" }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-store = { path = "../loyal-yield-store" }
num-bigint = "0.4"
num-traits = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
solana-account-decoder.workspace = true
solana-client.workspace = true
solana-pubsub-client.workspace = true
solana-program.workspace = true
solana-sdk.workspace = true
spl-token.workspace = true
spl-token-2022.workspace = true
solana-transaction-status-client-types = "2.3"
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
