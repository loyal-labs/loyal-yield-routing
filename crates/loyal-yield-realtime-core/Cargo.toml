[package]
name = "loyal-yield-realtime-core"
version = "0.1.0"
edition = "2021"
description = "Shared realtime contracts and durable event helpers for Loyal Yield"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio-rustls"] }
subtle = "2"
url = "2"
