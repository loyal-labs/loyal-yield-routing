[package]
name = "loyal-yield-realtime-core"
version = "0.1.0"
edition = "2021"
description = "Shared realtime contracts and durable event helpers for Loyal Yield"

[dependencies]
base64.workspace = true
bs58 = "0.5"
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
hmac = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
subtle = "2"
url = "2"
