[package]
name = "loyal-route-lookup-tables"
version = "0.1.0"
edition = "2021"
description = "Reusable route Address Lookup Table planning and persistence for Loyal"

[dependencies]
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
loyal-actions = { path = "../loyal-actions" }
loyal-solana-env = { path = "../loyal-solana-env" }
loyal-yield-store = { path = "../loyal-yield-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
solana-sdk.workspace = true
sqlx = { workspace = true, default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
