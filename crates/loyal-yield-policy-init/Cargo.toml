[package]
name = "loyal-yield-policy-init"
version = "0.1.0"
edition = "2021"
description = "Create Squads smart accounts and Loyal yield-route policies"

[dependencies]
base64 = "0.22"
bincode = "1.3"
borsh.workspace = true
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
loyal-actions = { path = "../loyal-actions" }
serde_json = "1"
solana-client = "2.3"
solana-sdk.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["json", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
