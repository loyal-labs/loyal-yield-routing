[package]
name = "balance-sweep-ata-projector"
version = "0.1.0"
edition = "2021"
description = "Lightweight projector for Loyal balance sweep ATA observations"

[dependencies]
anyhow = "1"
balance-sweep-ata-observations = { path = "../balance-sweep-ata-observations" }
clap = { version = "4.5", features = ["derive", "env"] }
loyal-yield-orchestrator = { path = "../loyal-yield-orchestrator" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

