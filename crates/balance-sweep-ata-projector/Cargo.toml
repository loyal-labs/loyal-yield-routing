[package]
name = "balance-sweep-ata-projector"
version = "0.1.0"
edition = "2021"
description = "Lightweight projector for Loyal balance sweep ATA observations"

[dependencies]
anyhow.workspace = true
balance-sweep-ata-observations = { path = "../balance-sweep-ata-observations" }
clap = { workspace = true, features = ["derive", "env"] }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-store = { path = "../loyal-yield-store" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing.workspace = true
