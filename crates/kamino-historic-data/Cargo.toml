[package]
name = "kamino-historic-data"
version = "0.1.0"
edition = "2021"
description = "Historic Kamino reserve data backfills and JSONL imports for Loyal yield routing"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-kamino-codec = { path = "../loyal-kamino-codec" }
loyal-kamino-data = { path = "../loyal-kamino-data" }
prost = "0.13"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
solana-client.workspace = true
solana-sdk.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
