[package]
name = "loyal-actions"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for building Loyal delegated Squads actions"

[[bin]]
name = "compile-voltr-kamino-policy"
path = "src/bin/compile_voltr_kamino_policy.rs"

[[bin]]
name = "compile-voltr-kamino-runtime-policy"
path = "src/bin/compile_voltr_kamino_runtime_policy.rs"

[[bin]]
name = "compile-voltr-custom-policy"
path = "src/bin/compile_voltr_custom_policy.rs"

[[bin]]
name = "compile-backyard-rwa-policy-catalog"
path = "src/bin/compile_backyard_rwa_policy_catalog.rs"

[dependencies]
base64.workspace = true
bincode = "1.3"
borsh.workspace = true
loyal-hub-abi.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2.workspace = true
solana-sdk.workspace = true
solana-system-interface.workspace = true
spl-token.workspace = true
spl-token-2022.workspace = true
thiserror.workspace = true
