[package]
name = "loyal-yield-router"
version = "0.1.0"
edition = "2021"
description = "TimescaleDB reads and update streams for Loyal yield routing inputs"
readme = "README.md"

[dependencies]
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true, default-features = false, features = ["chrono", "postgres", "runtime-tokio-rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
