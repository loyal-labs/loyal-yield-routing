[package]
name = "loyal-yield-router"
version = "0.1.0"
edition = "2021"
description = "TimescaleDB reads and update streams for Loyal yield routing inputs"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "postgres", "runtime-tokio-rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
