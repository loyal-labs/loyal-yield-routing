[package]
name = "loyal-yield-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Postgres-backed orchestration state for Loyal yield routing"

[dependencies]
borsh.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
loyal-actions = { path = "../loyal-actions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-client = "2.3"
solana-sdk.workspace = true
spl-token.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "same_mint_route_runner"
path = "src/bin/same_mint_route_runner.rs"

[[bin]]
name = "manual_kamino_deposit"
path = "src/bin/manual_kamino_deposit.rs"
