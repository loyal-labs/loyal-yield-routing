[package]
name = "loyal-yield-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Postgres-backed orchestration state for Loyal yield routing"

[dependencies]
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-actions = { path = "../loyal-actions" }
loyal-observability = { path = "../loyal-observability" }
loyal-yield-router = { path = "../loyal-yield-router" }
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-client = "2.3"
solana-account-decoder-client-types = "2.3"
solana-rpc-client = "2.3"
solana-sdk.workspace = true
spl-token.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
bytemuck = "1"
