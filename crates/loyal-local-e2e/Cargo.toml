[package]
name = "loyal-local-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local-chain helpers for cross-repository Loyal E2E verifiers"

[dependencies]
anyhow.workspace = true
base64.workspace = true
balance-sweep-ata-monitor = { path = "../balance-sweep-ata-monitor", features = ["local-e2e"] }
loyal-yield-store = { path = "../loyal-yield-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
spl-token.workspace = true
squads-test-harness = { path = "../squads-test-harness" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
