[package]
name = "squads-test-harness"
version = "0.1.0"
edition = "2021"
description = "Lean LiteSVM helpers for testing Squads smart-account flows"

[dependencies]
base64.workspace = true
borsh.workspace = true
litesvm.workspace = true
loyal-actions = { path = "../loyal-actions" }
solana-program-runtime = "2.3.13"
solana-sdk.workspace = true
solana-system-interface.workspace = true
spl-token.workspace = true
spl-token-2022.workspace = true
serde_json = "1"

[dev-dependencies]
bincode = "1.3"
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-solana-env = { path = "../loyal-solana-env" }
loyal-yield-router = { path = "../loyal-yield-router" }
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
solana-client.workspace = true
solana-transaction-status-client-types.workspace = true
spl-associated-token-account.workspace = true
squads-multisig = { git = "https://github.com/Squads-Protocol/v4", rev = "c14a6d607a4d5295c7df90499674418b57aff792" }
tokio = { workspace = true, features = ["rt"] }
