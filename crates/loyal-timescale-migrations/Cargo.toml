[package]
name = "loyal-timescale-migrations"
version = "0.1.0"
edition = "2021"
description = "SQLx migration runner for the Kamino Timescale market-data database"

[dependencies]
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
