[package]
name = "loyal-kamino-data"
version = "0.1.0"
edition = "2021"
description = "Kamino catalog HTTP and Timescale integrations without streaming clients"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
klend-interface = { git = "https://github.com/Kamino-Finance/klend" }
loyal-actions = { path = "../loyal-actions" }
loyal-kamino-codec = { path = "../loyal-kamino-codec" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-sdk.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tracing = "0.1"
