# Regenerates go/workers/testdata/klend/same-mint-route.golden.json from the
# retained Rust fleet worker. Not a workspace member and never ships; see
# internal/fleet/klend_golden_test.go for the command.
[package]
name = "klend-golden-generator"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
loyal-fleet-worker = { path = "../../../../../crates/loyal-fleet-worker", features = ["klend-golden"] }
serde_json = "1"
